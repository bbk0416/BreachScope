schema_version: "1"
description: "Curated synthetic regression corpus for BreachScope native detection. This is not a production-world precision/recall benchmark."
thresholds:
  min_precision: 0.95
  min_recall: 0.9
  min_malicious_events: 48
  min_benign_events: 24
corpora:
  - id: "active_directory_discovery"
    events_file: "samples/scenarios/active_directory_discovery.jsonl"
    classification: "malicious"
    expected_techniques_field: "sample_expected_techniques"
