schema: breachscope.external_holdout.v1
kind: external_blind_holdout

# external_calibration | external_baseline | final_blind_holdout
evaluation_class: final_blind_holdout

protocol:
  # These are explicit process attestations, not proof generated by the tool.
  independent_from_rule_authoring: true
  ground_truth_prepared_without_breachscope_findings: true
  final_holdout_seen_before_rule_freeze: false

provenance:
  source: REPLACE_WITH_REAL_SOURCE
  acquired_at: REPLACE_WITH_ISO8601
  license_or_permission: REPLACE_WITH_LICENSE_OR_PERMISSION
  notes: REPLACE_WITH_PROVENANCE_NOTES

# Paths are relative to --corpus-root. Holdout bytes should remain outside repo.
files:
  - path: example-security.evtx
    sha256: REPLACE_WITH_64_HEX_SHA256
    format: evtx
  - path: example-normalized.jsonl
    sha256: REPLACE_WITH_64_HEX_SHA256
    format: jsonl

# Optional scenario-level expectations. A scenario is a hit only when every
# expected technique is observed somewhere in findings for its source files.
scenarios:
  - scenario_id: example-scenario
    source_files:
      - example-security.evtx
    expected_techniques:
      - T1059.001

# Optional until labels are finalized. If provided, score verifies it.
labels:
  sha256: REPLACE_WITH_64_HEX_SHA256_AFTER_LABELING
