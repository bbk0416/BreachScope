oracle_actions:
  misc_sqlmap:
    disposition: NOT_EVALUATED_NO_SELECTED_WINDOWS_EVENT_ORACLE
    reason: >
      The pinned source performs SQL injection from the attacker against the DVWA Linux web server;
      the selected data source is one Windows Winlogbeat member, so absence of a Windows event cannot
      be treated as a detection miss.
  infect_email_exe:
    disposition: NOT_EVALUATED_NO_SELECTED_WINDOWS_EVENT_ORACLE
    reason: >
      The pinned source generates and sends a malicious attachment but does not define recipient-side
      attachment execution as part of this attack action.
  c2_take_screenshot:
    disposition: NOT_EVALUATED_NO_DETERMINISTIC_EVENT_ORACLE
    reason: >
      The pinned source performs a Meterpreter screenshot in an existing C2 session; the pinned collector
      configuration does not define one deterministic Windows event that is guaranteed to identify this action.
  c2_exfiltration:
    disposition: NOT_EVALUATED_NO_DETERMINISTIC_EVENT_ORACLE
    reason: >
      The pinned source collects remote DOC files through Meterpreter; the selected client Winlogbeat member
      does not provide a predeclared deterministic event identity for this action.
  c2_mimikatz:
    disposition: NOT_EVALUATED_NO_DETERMINISTIC_EVENT_ORACLE
    reason: >
      The pinned source loads Meterpreter kiwi and runs creds_all. The pinned Sysmon ProcessAccess section
      has an empty include, so a credential-access event cannot be assumed as a deterministic oracle.
  misc_download_malware:
    disposition: EVALUATED_SOURCE_DERIVED_ORACLE
    predicate_id: DOWNLOAD_POWERSHELL_EXACT_SOURCE_TOKENS_V1
    source_facts:
      target_host: 192.168.56.101
      url: http://172.18.1.1/meterpreter_bind_tcp.exe
      output_file: C:\Windows\meterpreter_bind_tcp.exe
      command_family: powershell Invoke-WebRequest
    predicate: >
      Within the preregistered misc_download_malware window, normalized event.command_line must contain
      all of: invoke-webrequest, http://172.18.1.1/meterpreter_bind_tcp.exe,
      and c:\windows\meterpreter_bind_tcp.exe, case-insensitive.
  misc_set_autostart:
    disposition: EVALUATED_SOURCE_DERIVED_ORACLE
    predicate_id: AUTOSTART_RUN_KEY_EXACT_SOURCE_TOKENS_V1
    source_facts:
      target_host: 192.168.56.101
      registry_key: HKLM\Software\Microsoft\Windows\CurrentVersion\Run
      value_name: Meterpreter Bind TCP
      value_data: meterpreter_bind_tcp.exe
    predicate: >
      Within the preregistered misc_set_autostart window, match either a registry event whose TargetObject
      contains currentversion\run and whose TargetObject or Details contains the pinned value name/data,
      or a normalized command line containing reg add, currentversion\run, and meterpreter_bind_tcp.exe.
  misc_execute_malware:
    disposition: EVALUATED_SOURCE_DERIVED_ORACLE
    predicate_id: PROCESS_CREATE_EXACT_MALWARE_IMAGE_V1
    source_facts:
      target_host: 192.168.56.101
      executable: C:\Windows\meterpreter_bind_tcp.exe
    predicate: >
      Within the preregistered misc_execute_malware window, match Sysmon ProcessCreate-compatible normalized
      events with event_id 1 whose raw Image ends with \meterpreter_bind_tcp.exe, case-insensitive.

