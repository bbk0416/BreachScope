representative_root_causes:
  T1003:
    bsf_shape: powershell -command - plus process/open targeting lsass.exe
    diagnosis: BRAWL BSF oracle contains process-open meaning, but the normalized endpoint telemetry used by the detector does not expose a matching T1003 observable under current rules.
  T1016:
    bsf_shape: nbtstat -n
    diagnosis: no current T1016 rule
  T1069:
    bsf_shape: powershell -command -
    diagnosis: no current T1069 rule; semantic script content is not present in the command line
  T1087:
    bsf_shape: powershell -command -
    diagnosis: current T1087 rules cover specific account-discovery commands/events; the semantic script content is not present in the command line
  T1018:
    bsf_shape: powershell -command -
    diagnosis: current T1018 rule is nslookup-oriented and does not cover this opaque PowerShell form
  T1059.001:
    bsf_shape: powershell -command -
    diagnosis: current PowerShell rules intentionally require encoded, bypass, download, or Invoke-Expression shapes rather than generic PowerShell
  T1547.001:
    bsf_shape: reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run
    diagnosis: current command rule targets HKCU Run-key syntax, while the registry-event rule depends on telemetry not emitted by the documented BRAWL Sysmon configuration
  T1021.002:
    bsf_shape: net use \\host\C$ with credentials
    diagnosis: no current T1021.002 rule
  T1105:
    bsf_shape: cmd /c copy local.exe \\host\C$\remote.exe
    diagnosis: current T1105 rules target web download or certutil; 3 of 15 pairs also had no normalized telemetry inside the frozen BSF window
  T1047:
    bsf_shape: wmic /node:host /user:... /password:<redacted> process call create ...
    diagnosis: current WMI rules cover narrower exact WMIC/XSL/query/WmiPrvSE-child shapes; the /node and credential arguments break the simple command pattern

