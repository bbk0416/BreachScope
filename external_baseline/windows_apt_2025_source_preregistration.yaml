upstream_documented_properties:
  environment: Windows 10
  adversary_emulation: MITRE Caldera 5.0.0
  collection: Wazuh 4.5.2 with Windows Event Logs and Sysmon
  scenario_count: 36
  repetitions_per_scenario: 10
  log_record_count_approx: 102000
  general_log_count_reported: 38393
  malicious_log_count_reported: 63620
  observed_attack_technique_count: 45
  observed_enterprise_tactic_count: 9
  package:
    log_csv_files: 17
    per_period_log_csv_files: 16
    combined_log_csv_files: 1
    supplementary_csv_files:
      - scenario_manifest.csv
      - validation_summary.csv
    integrity_file: checksums.sha256
  documented_fields:
    - Timestamp
    - Agent-Name
    - Full-log
    - Rule Description
    - MITRE Tactic and Associated IDs
    - MITRE Technique
    - File Hash (MD5)
    - File Hash (SHA256)
    - Source-OS
    - Path
