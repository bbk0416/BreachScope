freshness_boundary:
  source_family_used_by_prior_breachscope_detector_evaluation: false
  source_family_seen_only_as_public_metadata_candidate_before_this_preregistration: true
  raw_rows_seen_before_detector_freeze: false
  detector_rules_may_change_after_this_preregistration: false
  note: public article metadata and schema descriptions are allowed; event/log row values remain unseen until the phase-2 adapter/scoring contract is merged

phase_1_after_merge:
  allowed_operations:
    - download the exact Mendeley version-3 package without opening semantic log rows
    - record package byte size and SHA-256
    - list archive member names and sizes
    - verify bundled checksums.sha256 against package CSV files
    - inspect bundled README, configuration, and example-code text
    - inspect only CSV header rows and encoding/dialect
    - count physical data rows without parsing semantic field values
  prohibited_operations:
    - inspect or print any log data row values
    - inspect scenario_manifest.csv data rows
    - inspect validation_summary.csv data rows
    - run BreachScope rules against any Windows-APT row
    - modify detector rules based on package contents
    - select favorable files, scenarios, techniques, hosts, dates, or labels after seeing results
  required_output:
    - exact package/source bytes identity
    - complete member inventory
    - checksum verification status
    - exact CSV header schemas
    - exact deterministic file-selection rule
    - label provenance decision or fail-closed result

phase_2_gate_before_semantic_rows:
  requirements:
    - exact event-file selection must be frozen
    - duplicate combined/per-period representation policy must be frozen
    - CSV-to-BreachScope Event adapter must be implemented from documented schema/header information only
    - adapter SHA-256 must be frozen
    - source-intent malicious/general classification must use an explicit upstream-provided class field or an upstream-documented deterministic partition
    - ATT&CK/Wazuh technique tags must not be used as the malicious-versus-general oracle
    - scoring semantics and claim boundaries must be frozen
    - one-pass evaluator and permanent lock policy must be frozen
    - synthetic adapter/scorer tests and full repository regression must pass
  fail_closed:
    - if no explicit upstream-provided source-intent class can be identified without semantic row inspection, do not infer benign/malicious from MITRE tags or detector behavior
    - if the package layout cannot be deterministically mapped to the documented 16 per-period plus one combined log structure, stop and record source-format failure
    - if bundled checksums are absent or fail, stop before semantic row inspection

planned_selection:
  event_rows: all 16 per-period log CSVs
  excluded_event_rows:
    - the single combined/consolidated log CSV because it duplicates per-period rows
    - scenario_manifest.csv
    - validation_summary.csv
  supplementary_metadata_use: phase-2 scoring may use scenario_manifest and validation_summary only after their role is frozen in the phase-2 contract
  no_posthoc_subsetting: true

planned_metrics:
  attack:
    primary: source-intent malicious row flagged fraction
    technique_alignment: descriptive_only_if_upstream_label_provenance_is_explicit
    prohibited_name: recall
  benign:
    primary: source-intent general row flagged fraction
    prohibited_name: confirmed_false_positive_rate
  all:
    report_parse_or_normalization_errors: true
    report_findings_by_rule: true
    report_flagged_rows: true
    no_production_metric_claim: true

claim_boundaries:
  event_level_attack_ground_truth: NOT_ESTABLISHED
  event_level_benign_ground_truth: NOT_ESTABLISHED
  upstream_wazuh_mitre_mapping_is_independent_oracle: false
  source_intent_attack_general_partition: TO_BE_CONFIRMED_IN_PHASE_1
  confirmed_false_positive_rate: NOT_CLAIMED
  event_level_recall: NOT_CLAIMED
  production_accuracy: NOT_CLAIMED
  production_recall: NOT_CLAIMED
  production_false_positive_rate: NOT_CLAIMED
