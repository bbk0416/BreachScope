timing_log_format_reference:
  repository: fkie-cad/socbed
  commit: 92ca444fac425a18141d90b09e3c9f8e7976dff4
  path: src/attacks/attackconsole.py
  git_blob_sha1: 4a4b3725c4cff1efd2bb7391cd9bb49a5b0c3177
  size_bytes: 10631
  sha256: cbcef9c4407fe18752aa124acc3837caa711d9b2437159e49746cd9ffea6d148
  supported_format_facts:
  - log records include an ISO timestamp as the first token
  - attack invocation emits event=run_attack
  - the same structured log record includes attack=<attack_name>

adapter:
  scope: EVALUATOR_ONLY_NO_PRODUCT_CODE_CHANGE
  input_format: SOCBED Winlogbeat Elasticsearch hit.to_dict JSONL
  timestamp_precedence:
  - "@timestamp"
  - timestamp
  host_precedence:
  - winlog.computer_name
  - host.name
  - host.hostname
  - agent.hostname
  - computer_name
  source_precedence:
  - winlog.provider_name
  - event.provider
  - winlog.channel
  - source_name
  event_id_precedence:
  - winlog.event_id
  - event.code
  - event_id
  command_line_precedence:
  - winlog.event_data.CommandLine
  - winlog.event_data.ProcessCommandLine
  - process.command_line
  - command_line
  raw_mapping:
    preserve_original_nested_row: true
    copy_winlog_event_data_keys_to_raw_top_level_without_overwrite: true
    preserve_channel_and_record_id_when_available: true
    apply_breachscope_canonical_enrichment: true
  invalid_json_policy: FAIL_CANONICAL
  missing_or_unparseable_timestamp_policy: FAIL_CANONICAL

timeline:
  source: source attackconsole event=run_attack records
  expected_attack_order:
  - misc_sqlmap
  - infect_email_exe
  - c2_take_screenshot
  - c2_exfiltration
  - c2_mimikatz
  - misc_download_malware
  - misc_set_autostart
  - misc_execute_malware
  exact_run_attack_record_count_required: 8
  timestamps_must_be_strictly_increasing: true
  maximum_step_window_seconds: 180
  window_definition: each step starts at its actual run_attack timestamp and ends at the earlier of 180 seconds later or the next step run_attack timestamp; the final step ends 180 seconds after its run_attack timestamp

measurement:
  stages:
  - evaluator_adapter
  - breachscope_normalizer
  - breachscope_native_detection
  - breachscope_correlation
  - breachscope_scenario_inference
  report_generation_executed: false
  per_step_temporal_outputs:
  - event_count
  - finding_count
  - finding_rule_ids
  - finding_techniques
  - finding_hosts
  - chain_start_count
  - chain_types
  - scenario_start_count
  - scenario_stages
  - first_finding_delay_seconds
  - first_chain_delay_seconds
  - first_scenario_delay_seconds
  aggregate_outputs:
  - steps_with_events
  - steps_with_findings
  - steps_with_chain_starts
  - steps_with_scenario_starts
  - finding_window_occupancy_fraction
  - chain_start_window_occupancy_fraction
  - scenario_start_window_occupancy_fraction
  temporal_coincidence_is_not_semantic_attack_attribution: true
  attack_step_expected_techniques: NOT_DEFINED
  event_level_labels: NOT_AVAILABLE

runner:
  path: scripts/p2_35c_socbed_timeline_one_pass.py
  sha256: 98a4980e269e42ba99d2178a9a4849474a6620c522a052f5552ec87394962aaa
  python_major_minor: "3.11"
  operating_system: Windows
  result_file: result.json
  lock_file: P2_35C_ONE_PASS.lock
  permanent_exclusive_lock: true

protocol:
  contract_must_merge_before_selected_jsonl_or_timing_log_content_observation: true
  permanent_lock_required: true
  duplicate_canonical_execution_allowed: false
  first_completed_or_failed_execution_is_canonical: true
  replace_result_for_better_outcome: false
  runner_change_requires_new_analysis_id: true
  adapter_change_requires_new_analysis_id: true
  scoring_change_requires_new_analysis_id: true
  product_or_rule_change_before_measurement_allowed: false
  result_driven_tuning_before_canonical_measurement_allowed: false

decision_boundary:
  this_measurement_can_establish:
  - exact source attack invocation order and timestamps from the pinned timing log
  - whether BreachScope events findings chain starts and scenario starts occupy each preregistered source-time window
  this_measurement_cannot_establish:
  - that any output within a window was semantically caused by the named attack step
  - event-level precision or recall
  - chain precision or recall
  - scenario precision or recall
  - production reconstruction quality

claim_boundary:
  source_attack_invocation_order: NOT_YET_MEASURED
  temporal_window_occupancy: NOT_YET_MEASURED
  attack_step_semantic_attribution: NOT_EVALUATED
  event_level_precision: NOT_EVALUATED
  event_level_recall: NOT_EVALUATED
  chain_precision: NOT_EVALUATED
  chain_recall: NOT_EVALUATED
  scenario_precision: NOT_EVALUATED
  scenario_recall: NOT_EVALUATED
  production_reconstruction_quality: NOT_CLAIMED
  statistical_benchmark: false
