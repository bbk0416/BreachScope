schema: breachscope.p2_37_dedale_event_level_holdout_preregistration.v1
analysis_id: p2-37-dedale-event-level-holdout-v1
status: PREREGISTERED_SOURCE_SELECTION_NOT_DOWNLOADED_NOT_RUN
created_date: 2026-10-01
purpose: >-
  Evaluate the unchanged current 73-rule detector against a previously unused
  Windows Winlogbeat corpus with dataset-supplied event-level attack labels.
  Freeze the source, split, label mapping, and abort conditions before archive
  download, event parsing, label parsing, or detector execution.

