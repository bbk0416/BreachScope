  groundtruth_archive:
    provider_filename: system_logs_labels.zip
    file_persistent_id: doi:10.57745/GFI7BE
    size_bytes: 2669407
    provider_md5: 455d0a7042531eff74285006f97822e4
    sha256: TO_BE_BOUND_AFTER_FULL_DOWNLOAD
    http_range_verified: true
    outer_zip_file_count: 5
    extraction_required_before_adapter_run: false
    winlogbeat_label_subtree: system_labels/clients_1_and_2
    winlogbeat_class_1_member: system_labels/clients_1_and_2/malicious_events_class_1.jsonl
    winlogbeat_class_1_and_2_member: system_labels/clients_1_and_2/malicious_events_class_1_and_2.jsonl
    separate_class_2_member_exists: false
    auditbeat_label_subtree_excluded: system_labels/internal_server
  provider_documented_label_classes:
    benign: LOGS_RELATED_TO_BENIGN_ACTIVITY
    class_1: LOGS_CLEARLY_LINKED_TO_A_MALICIOUS_ACTION
    class_2: LOGS_THAT_ARE_CONSEQUENCES_OR_DEPENDENT_ON_ATTACK_STEP_OPERATION
  provider_documented_usage:
    first_two_weeks: BENIGN_ONLY
    third_week_attack_start: true
    attack_duration_days: 8
    recommended_training_validation_window: FIRST_TWO_WEEKS
    recommended_test_window: LAST_TWO_WEEKS

selection_policy:
  scoring_window: LAST_TWO_WEEKS_ONLY
  first_two_weeks_used_for_rule_tuning: false
  first_two_weeks_scored_in_p2_37: false
  test_window_derivation:
    method: LAST_14_OF_EXACTLY_28_CONSECUTIVE_UTC_DATES
    required_distinct_utc_dates: 28
    require_consecutive_utc_dates: true
    derive_from_full_winlogbeat_before_normalization: true
    labels_may_be_read_during_window_derivation: false
    detector_may_run_during_window_derivation: false
    expected_start_and_end_must_be_recorded_in_execution_contract: true
    if_date_contract_fails: ABORT_BEFORE_NORMALIZATION
  source_member_selection: >-
    Select every Winlogbeat JSONL event whose @timestamp falls inside the
    automatically derived last 14 UTC dates of an exactly 28-day consecutive
    Winlogbeat source. The exact start/end are frozen after source download and
    before normalization, labeling, or detector execution.
  post_score_member_or_event_dropping_allowed: false
  fallback_to_first_two_weeks_allowed: false
  fallback_to_different_dataset_allowed: false
  if_test_window_cannot_be_reproduced: ABORT_BEFORE_SCORING

label_mapping_contract:
  provider_class_1_to_external_holdout_label: malicious
  provider_class_2_derivation: CLASS_1_AND_2_EXACT_SET_MINUS_CLASS_1_EXACT_SET
  derived_class_2_to_external_holdout_label: ignore
  remaining_test_window_event_to_external_holdout_label: benign
  derived_class_2_excluded_from_confusion_matrix_denominators: true
  class_1_must_be_exact_subset_of_class_1_and_2: true
  class_1_and_class_1_and_2_must_be_exact_subsets_of_selected_winlogbeat_events: true
  auditbeat_internal_server_labels_must_not_enter_winlogbeat_scoring: true
  exact_reconciliation_required_before_scoring: true
  fuzzy_timestamp_or_process_name_matching_allowed: false
  unmatched_groundtruth_event_policy: ABORT_BEFORE_SCORING
  ambiguous_or_duplicate_groundtruth_match_policy: ABORT_BEFORE_SCORING
  remaining_event_may_be_called_benign_only_after_subset_reconciliation_passes: true
  dataset_labels_treated_as_provider_ground_truth_not_independent_adjudication: true

execution_gate:
  source_preregistration_must_be_merged_before_download: true
  bind_exact_archive_hashes_before_indexing: true
  provider_md5_must_match_before_processing: true
  full_download_sha256_must_be_recorded_before_processing: true
  outer_zip_must_be_streamed_without_bulk_extraction: true
  inspect_window_before_normalization: true
  window_inspection_must_not_read_labels_or_run_detection: true
  execution_contract_must_bind_derived_window_start_and_end: true
  freeze_current_repo_and_rule_tree_before_scoring: true
  index_without_detection_before_label_generation: true
  generated_label_file_must_be_hash_bound_before_scoring: true
  label_generation_must_follow_only_the_preregistered_mapping: true
  detector_must_not_run_before_execution_contract_merge: true
  source_split_or_labels_must_not_depend_on_detector_output: true
  single_canonical_scoring_run_required: true

measurement:
  report_tp_fp_tn_fn: true
  report_precision: true
  report_recall: true
  report_false_positive_rate: true
  report_flagged_ignored_events: true
  report_expected_technique_accounting_when_source_labels_support_it: true
  report_runtime_seconds: true
  report_peak_memory_mb: true
  report_per_source_counts: true

claim_boundary:
