  base_main_commit: 0fcad967c4d1a04b58800c5d0e761a91c47b8773
  current_detection_evidence: external_baseline/current_detection_evidence.yaml
  source_metadata_inspected_before_merge: true
  archive_bytes_downloaded_before_merge: false
  corpus_event_contents_parsed_before_merge: false
  groundtruth_event_contents_parsed_before_merge: false
  detector_executed_against_selected_source_before_merge: false
  source_selection_may_not_change_after_merge: true
  exact_source_bytes_must_be_bound_after_merge_before_indexing: true
  separate_execution_contract_required_before_scoring: true

