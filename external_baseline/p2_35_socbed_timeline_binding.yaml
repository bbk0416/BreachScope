selection_basis:
  source_repository_previously_used_by_breachscope: false
  breachscope_repository_search_hits_for_socbed_before_binding: 0
  source_selected_from_public_readme_and_schedule_metadata_only: true
  dataset_archive_downloaded_before_binding: false
  dataset_archive_opened_before_binding: false
  archive_member_inventory_observed_before_binding: false
  windows_event_log_content_observed_before_binding: false
  breachscope_detector_executed_on_source_before_binding: false
  breachscope_output_observed_before_binding: false

selected_run:
  host_configuration: host1_bestpractice
  iteration: 1
  rationale: deterministic first run from the first best-practice configuration documented by the source; selected before archive inventory
  expected_windows_member_policy: exactly one archive member under the host1_bestpractice configuration whose basename is winlogbeat_01.jsonl
  zero_or_multiple_matching_members: ABORT_UNSUPPORTED
  fallback_to_other_configuration_or_iteration_after_inventory: false

source_defined_timeline:
  schedule_source: run_simulations
  session_log_window_seconds: 3600
  first_attack_nominal_offset_seconds: 900
  inter_step_nominal_spacing_seconds: 180
  timing_semantics: nominal invocation offsets relative to the script session start; command runtime and completion times are not asserted
  steps:
  - ordinal: 1
    attack: misc_sqlmap
    nominal_offset_seconds: 900
  - ordinal: 2
    attack: infect_email_exe
    nominal_offset_seconds: 1080
  - ordinal: 3
    attack: c2_take_screenshot
    nominal_offset_seconds: 1260
  - ordinal: 4
    attack: c2_exfiltration
    nominal_offset_seconds: 1440
  - ordinal: 5
    attack: c2_mimikatz
    nominal_offset_seconds: 1620
  - ordinal: 6
    attack: misc_download_malware
    nominal_offset_seconds: 1800
  - ordinal: 7
    attack: misc_set_autostart
    nominal_offset_seconds: 1980
  - ordinal: 8
    attack: misc_execute_malware
    nominal_offset_seconds: 2160

protocol:
  phase_a_binding_only: true
  binding_must_merge_before_dataset_download: true
  phase_b_after_binding_merge:
  - download only the exact dataset.zip bytes from the pinned source commit
  - verify exact byte size and Git blob identity before opening the archive
  - compute archive SHA256
  - inspect archive member names and uncompressed sizes only
  - require the preregistered host1_bestpractice iteration-1 Windows member to resolve uniquely
  - record whether source-generated attackconsole or session timing logs exist by member name only
  - do not read selected Windows JSONL content
  - do not execute BreachScope
  - do not inspect BreachScope output
  phase_c_required_before_event_content_observation: freeze selected member bytes, ingestion adapter, timeline-alignment scoring contract, and one-pass runner before reading any event record
  duplicate_canonical_measurement_allowed: false
  first_completed_or_failed_execution_is_canonical: true
  result_driven_remeasurement_allowed: false
  tuning_after_source_observation_before_measurement_allowed: false

planned_measurement:
  primary_question: does current BreachScope preserve source-defined attack-step ordering in its findings, chains, and scenarios on a previously unused external simulation run
  units:
  - source_defined_attack_step
  - breachscope_finding
  - breachscope_chain
  - breachscope_scenario
  exact_time_window_scoring: DEFERRED_UNTIL_PHASE_B_CAN_CONFIRM_A_SOURCE_SUPPORTED_SESSION_TIME_ANCHOR
  step_visibility_scoring: DEFERRED_UNTIL_PHASE_C_PREREGISTRATION
  chain_order_alignment: DEFERRED_UNTIL_PHASE_C_PREREGISTRATION
  scenario_order_alignment: DEFERRED_UNTIL_PHASE_C_PREREGISTRATION
  event_level_precision: NOT_MEASURED
  event_level_recall: NOT_MEASURED

claim_boundary:
  independent_source: true
  source_timeline_known_before_event_observation: true
  timeline_reconstruction_quality: NOT_YET_MEASURED
  chain_precision: NOT_CLAIMED
  chain_recall: NOT_CLAIMED
  scenario_precision: NOT_CLAIMED
  scenario_recall: NOT_CLAIMED
  production_detection_quality: NOT_CLAIMED
  production_reconstruction_quality: NOT_CLAIMED
  statistical_benchmark: false
