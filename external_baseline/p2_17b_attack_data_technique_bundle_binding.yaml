notes: >-
  Only repository tree paths, Git blob metadata, YAML byte hashes, and Git LFS
  pointer OID/size metadata were inspected before this binding. YAML semantic
  contents and telemetry contents remain unopened. The path label supports only
  a dataset-level expected-technique HIT/MISS, not event-level recall.
