measurement_contract:
  unit: dataset
  expected_technique_source: attack_data directory path
  expected_dataset_count: 5
  score: >-
    For each bound dataset, record HIT when at least one BreachScope finding
    carries that dataset's path-bound ATT&CK technique ID; otherwise record MISS.
  path_label_hit_rate_is_event_level_recall: false
  parser_failure_counts_as_dataset_failure: true
  record: >-
    source SHA verification, event count, parse errors, findings, flagged events,
    observed finding technique IDs, expected-technique HIT/MISS, chain counts,
    scenario counts, stage timings, and peak Python memory
  no_result_driven_remeasurement: true
