  detection_precision: NOT_CLAIMED
  detection_recall: NOT_CLAIMED
  false_positive_rate: NOT_CLAIMED
  path_label_dataset_hit_rate: MEASURABLE_AFTER_ONE_PASS
  chain_precision: NOT_CLAIMED
