source_documentation_assessment:
  associated_paper:
    title: "Enhancing Enterprise Network Security: Comparing Machine-Level and Process-Level Analysis for Dynamic Malware Detection"
    arxiv_id: "2310.18165"
    supported_facts:
      - LME data are Windows Events stored in EVTX and were converted to newline JSON for research preprocessing.
      - ProcessGuid was used to correlate events into process activity sequences.
      - The dataset contains benign and malicious process events and each experiment set contains both classes.
    missing_for_p2_22:
      - explicit numeric encoding for the public CSV label values 0 and 1
      - source-supported reproducible mapping from each raw EVTX event to a labeled public CSV row
  bound_repository:
    documentation_files_beyond_license: false
    explicit_label_dictionary_present: false
    explicit_evtx_to_csv_mapping_manifest_present: false
abort_reason:
  code: SOURCE_LABEL_MAPPING_NOT_REPRODUCIBLE
  explanation: >-
    The bound source does not provide enough documented information to assign a source-supported
    benign label to raw EVTX records without inference. Numeric CSV labels are present, but their
    0/1 semantics are not explicitly documented in the bound repository or associated paper, and
    the public CSV schema contains no explicit EVTX source-file identifier or source path.
  prohibited_inferences:
    - assume label 0 means benign and label 1 means malicious
    - infer label meaning from suspicious-looking filenames, paths, RuleName values, or feature distributions
    - invent an EVTX-to-CSV join based on timestamps, GUIDs, hosts, or event fields without a source-defined mapping contract
