  note: 'This file is an evidence index, not a performance summary. P2-12 and P2-13
    remain historical evidence obtained under the frozen 66-rule detector. P2-17C
    later produced an independent locked 1/5 path-label dataset result and was not
    rerun for a replacement score. P2-20 is post-holdout development based on the
    already observed P2-17C corpus: it adds multiline Event XML framing plus two narrow
    command rules, and records a separate exact-predicate probe on the pinned P2-13
    Windows 11 benign source. The P2-20 5/5 post-hoc result is not an independent
    holdout, and the 0-match benign probe is not a fresh full-rulepack FPR. No production
    accuracy, precision, recall, detection rate, false-positive rate, confirmed false-positive
    rate, representative production population, or final blind holdout is claimed.
    P2-21 adds a new independent one-pass evaluation under the 68-rule detector: 4/8
    path-labeled datasets met the preregistered HIT condition. This 50% dataset hit
    rate is not event-level recall and must not be replaced by post-hoc reruns. P2-22
    attempted to bind a new benign source but was aborted before detector execution
    because the public source did not provide a reproducible source-supported mapping
    from raw EVTX records to benign labels; no fresh benign FPR was measured. P2-22B
    then bound LMD-2023, but the preregistered 1.75M archive contained CSV members only
    and no raw Normal EVTX member, so it was also aborted before detector execution.
    P2-24B later ran a preregistered one-pass negative control on a previously unused,
    source-designated clean Windows Security EVTX fixture: all 7 records parsed with
    zero errors, all 68 rules were evaluated, and 0/7 events were flagged. This is only
    a seven-record parser fixture, so it does not establish a general fresh full benign
    FPR for the current rulepack or any production false-positive rate.'
