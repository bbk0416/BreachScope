  note: 'This file is an evidence index, not a performance summary. P2-12 and P2-13
    remain historical evidence obtained under the frozen 66-rule detector. P2-17C
    later produced an independent locked 1/5 path-label dataset result and was not
    rerun for a replacement score. P2-20 is post-holdout development based on the
    already observed P2-17C corpus: it adds multiline Event XML framing plus two narrow
    command rules, and records a separate exact-predicate probe on the pinned P2-13
    Windows 11 benign source. The P2-20 5/5 post-hoc result is not an independent
    holdout, and the 0-match benign probe is not a fresh full-rulepack FPR. No production
    accuracy, precision, recall, detection rate, false-positive rate, confirmed false-positive
    rate, representative production population, or final blind holdout is claimed.
    P2-21 adds a new independent one-pass evaluation under the 68-rule detector: 4/8
    path-labeled datasets met the preregistered HIT condition. This 50% dataset hit
    rate is not event-level recall and must not be replaced by post-hoc reruns. P2-22
    attempted to bind a new benign source but was aborted before detector execution
    because the public source did not provide a reproducible source-supported mapping
    from raw EVTX records to benign labels; no fresh benign FPR was measured. P2-22B
    then bound LMD-2023, but the preregistered 1.75M archive contained CSV members only
    and no raw Normal EVTX member, so it was also aborted before detector execution.
    P2-24B later ran a preregistered one-pass negative control on a previously unused,
    source-designated clean Windows Security EVTX fixture: all 7 records parsed with
    zero errors, all 68 rules were evaluated, and 0/7 events were flagged. P2-24C then
    measured one larger, previously unused ASK92 Sysmon export under a stricter
    preregistered benign time boundary: all 34,534 records parsed, no timestamps crossed
    the strict cutoff, and 2,404/34,534 records produced findings (6.961255574216714%).
    The ASK92 label is source collection intent plus a timestamp gate, not event-level
    manual adjudication, so those 2,404 events are not claimed as confirmed false
    positives. P2-24D uses the already observed P2-24C source only as development data
    to narrow three noisy command-line predicates; its estimated 570-event residual is
    post-hoc and is not a fresh measurement. P2-25 then performed a preregistered,
    first-run-only revalidation of the unchanged P2-24D rulepack on eight previously
    unused DeepBlueCLI README-labeled attack fixtures: 6/8 fixtures produced at least one
    finding, 2/8 did not, and all 450 parsed events had zero parse errors. The 75% fixture
    hit rate is not event-level or technique recall, and a fixture HIT does not prove the
    named attack action itself was the triggering evidence. P2-26C then completed the
    preregistered first-run-only fresh benign revalidation on a newly provisioned
    GitHub-hosted Windows 2025 runner captured before repository checkout: 1,643 events
    parsed with zero errors and 1 event was flagged by R-SCHTASK-4698, for an observed
    source-intent benign flagged-event fraction of 1/1,643 = 0.06086427267194157%.
    The CI population is not event-level adjudicated and is not claimed representative
    of production workstations, so the flagged event is not a confirmed false positive
    and no general benign FPR or production rate is claimed. P2-29 later performs a
    performance-only single-parse refactor of the live EVTX XML normalizer. The historical
    P2-20 parser blob remains recorded unchanged; P2-29 records the new live parser blob
    separately and preserves the P2-26C current evidence ID and unchanged 68-rule tree
    after exact old/new normalized-output equivalence across all 450 P2-25 attack
    records and all 1,643 P2-26C benign records (2,093 total), with zero mismatches.
    P2-35I later adds one post-hoc T1036.003 masquerading rule plus ECS process-field
    canonical fallback and basename field comparison. Its development evidence is not
    fresh validation. P2-25 and P2-26C therefore remain historical validation of the
    preceding 68-rule detector and do not establish performance for the current 69-rule
    detector. P2-35M later completed the preregistered current-69-rule revalidation
    on ten previously unused Yamato Security original attack EVTX fixtures and the
    previously unused win2022-ad exact benign archive: 6/10 fixtures had at least one
    finding, but only 1/10 matched the source-path expected ATT&CK technique; 425,974
    benign-source-intent events were parsed with 12 parse errors and 4 events were
    flagged by R-WMI-WMIPRVSE-CHILD-4688. The 60% fixture hit rate and 10% source-path
    technique-match fraction are not event-level recall, and 4/425,974 is an observed
    source-intent benign flagged-event fraction rather than a confirmed or production
    FPR. P2-35M therefore completes fresh attack and benign revalidation for the current
    69-rule detector without establishing an independent combined source-family holdout
    or any production accuracy, recall, or false-positive-rate claim.'
