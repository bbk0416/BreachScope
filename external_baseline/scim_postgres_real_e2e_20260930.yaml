bug_found_and_fixed:
  symptom: >-
    The first real PostgreSQL save_users call failed because psycopg.Connection
    does not expose executemany().
  root_cause: >-
    PostgreSQL save paths used connection.executemany(), while the fake
    PostgreSQL test connection exposed that non-psycopg API.
  fix: >-
    PostgreSQL batch writes now use cursor.executemany() through a dedicated
    helper, and the fake connection implements the matching cursor context API.

