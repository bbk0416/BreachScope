decision:
  candidate_rule: NO_GO
  product_rule_change: REVERTED_NOT_MERGED
  current_rules_tree_preserved: ac5b6f1db7af2208910e9a7954b414d21c6ef019dfcdf29ddfdd566cd77a9326
  current_rule_count_preserved: 68
  rationale: >-
    The generic named Run/RunOnce predicate correctly covers the SOCBED registry event but also
    matches 16 writes on a pinned source-intent benign Windows 11 corpus, including common
    auto-start entries for Avast, Google Drive, Discord, Edge, Opera, Everything, KeePass, and Zoom.
    That is sufficient evidence that the generic candidate is too broad to merge solely to close
    the posthoc SOCBED gap.
  next_rule_work: >-
    Any future persistence rule must add independently defensible suspicious context and must be
    evaluated against benign data before product merge. Do not add a SOCBED- or meterpreter-specific
    signature merely to improve this dataset.

