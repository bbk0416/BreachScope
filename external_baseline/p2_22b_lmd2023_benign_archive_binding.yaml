source_ground_truth:
  documentation:
    readme_path: README.md
    readme_git_blob_sha1: 3b257f7e6ebe80618bbfe7c1abcb82efe028e691
    paper_doi: 10.1007/s10207-023-00725-8
    later_label_definition_doi: 10.1007/s10207-025-01182-1
  readme_supported_facts:
    - LMD-2023 is Windows Sysmon telemetry and is offered in raw EVTX and CSV forms.
    - The published LMD-2023 family contains normal and malicious traffic.
    - Each LMD-2023 version contains separate Normal, EoRS, and EoHT subsets.
    - The Normal subset is the upstream-designated normal traffic subset.
  external_paper_supported_facts:
    - Normal traffic represents typical user activities such as logins, web browsing, file sharing, email, and social-media interaction.
    - The published class definition identifies Normal as class 0, EoRS as class 1, and EoHT as class 2.
  evaluation_label_basis: use only an upstream path/member explicitly designated Normal; do not infer benignness from event contents
selection_basis:
  source_repository_previously_used_by_breachscope: false
  breachscope_default_branch_search_hits_for_source_names: 0
  archive_bytes_downloaded_before_binding: false
  archive_contents_inspected_before_binding: false
  source_data_rows_or_events_inspected_before_binding: false
  metadata_consulted_before_binding:
    - repository README at pinned commit
    - Git commit/tree/blob metadata
    - Git LFS pointer OID and size
    - published paper dataset description
  p2_22_cerberus_source_reused: false
protocol:
  phase_a_archive_binding_only: true
  phase_b_after_binding_merge:
    - download the exact bound Git LFS object
    - verify SHA256 and byte size before opening the archive
    - inspect archive member names and sizes only
    - do not extract or parse EVTX contents
    - do not execute the BreachScope detector
    - do not inspect BreachScope output
  normal_subset_selection_policy: >-
    Prefer the published LMD-2023 1.75M version because it is the base dataset described by the
    source paper. Within that version, select only a raw/unmodified Windows EVTX artifact whose
    archive path explicitly identifies the upstream Normal subset. Do not select by detector behavior,
    event contents, file contents, or observed alert rate.
  phase_c_required_before_data_content_observation: >-
    Freeze and merge an exact Normal-member byte binding plus a scoring contract and runner before
    extracting or parsing the selected Normal telemetry.
  ambiguous_inventory_policy: >-
    If archive member names do not provide a unique source-supported raw Normal EVTX artifact for
    the 1.75M version, record ABORT_UNSUPPORTED. Do not inspect event contents to resolve ambiguity.
  detector_execution_before_phase_c_contract: prohibited
  tuning_after_source_observation_before_measurement_allowed: false
  no_result_driven_remeasurement: true
  p2_14e_final_blind_holdout_rerun: false
  p2_14e_artifacts_modified: false
claim_boundary:
  fresh_benign_evaluation: NOT_YET_MEASURED
  benign_false_positive_rate: NOT_YET_MEASURED
  production_false_positive_rate: NOT_CLAIMED
  production_accuracy: NOT_CLAIMED
  production_quality: NOT_CLAIMED
  representative_production_population: NOT_CLAIMED
notes: >-
  P2-22B is a replacement source after the Cerberus Trace source was retired. This phase binds only
  the exact historical LMD-2023 release archive and upstream benign semantics. No archive payload,
  member contents, EVTX record, or detector output was observed before this binding.
