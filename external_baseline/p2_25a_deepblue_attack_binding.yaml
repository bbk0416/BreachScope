  - pinned README text
  - public GitHub README rendering for the same DeepBlueCLI source
protocol:
  phase_a_binding_only: true
  phase_b_after_binding_merge:
  - download only the four exact bound EVTX blobs from the pinned commit
  - verify byte size and Git blob SHA-1 before any parser opens any file
  - compute and record SHA256 for each file without parsing records
  - do not execute the BreachScope detector
  - do not inspect EVTX record content
  phase_c_required_before_content_observation: Freeze and merge exact SHA256 values, per-dataset scoring expectations, and a one-pass runner before parsing any EVTX record.
  detector_execution_before_phase_c_contract: prohibited
  content_observation_before_phase_c_contract: prohibited
  tuning_after_source_observation_before_measurement_allowed: false
  duplicate_measurement_allowed: false
  first_completed_or_failed_execution_is_canonical: true
  no_result_driven_remeasurement: true
  p2_14e_final_blind_holdout_rerun: false
  p2_24c_canonical_result_modified: false
  p2_24d_development_diagnosis_modified: false
