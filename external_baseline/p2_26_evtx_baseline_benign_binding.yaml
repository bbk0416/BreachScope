source_ground_truth:
  label_basis: upstream README describes the repository as example goodware EVTX logs and the Windows 10 corpus as normal client activity
  source_level_label: GOODWARE_NORMAL_ACTIVITY
  event_level_labels: NOT_AVAILABLE
  confirmed_false_positive_labels: NOT_AVAILABLE
  production_representativeness: NOT_ESTABLISHED
  documented_activity:
  - software installation and updates
  - normal application launches and user interaction
  - web browsing and document download/open
  - archive create/extract activity
  - localhost client connections
  - screenshots and common developer/admin tool use
selection_basis:
  source_repository_previously_used_by_breachscope: false
  breachscope_default_branch_search_hits_for_source_names: 0
  release_asset_downloaded_before_binding: false
  release_archive_opened_before_binding: false
  evtx_members_extracted_before_binding: false
  evtx_member_bytes_opened_before_binding: false
  evtx_records_parsed_before_binding: false
  breachscope_detector_executed_before_binding: false
  selection_used_only_repository_metadata_readme_and_release_metadata: true
  rejected_candidates:
  - repository: libyal/libevtx
    reason: available test EVTX lacked sufficiently explicit benign source labeling
  - repository: YusukeJustinNakajima/SigmaOptimizer-UI
    reason: documentation referenced a benign archive but the archive was not present at the pinned repository commit
protocol:
  phase_a_binding_only: true
  phase_b_after_binding_merge:
  - download only release v0.8.5 asset win10-client.tgz
  - verify archive SHA256 before extraction
  - record exact archive byte size
  - extract without parsing EVTX records
  - inventory every extracted EVTX member path, byte size, and SHA256
  - do not execute the BreachScope detector
  - do not inspect BreachScope detector output
  phase_c_required_before_data_content_observation: freeze and merge the exact EVTX member inventory, scoring contract, and one-pass runner before parsing any EVTX record
  detector_execution_before_phase_c_contract: prohibited
  evtx_record_parsing_before_phase_c_contract: prohibited
  tuning_after_source_observation_before_measurement_allowed: false
  duplicate_measurement_allowed: false
  first_completed_or_failed_execution_is_canonical: true
  no_result_driven_remeasurement: true
  p2_14e_final_blind_holdout_rerun: false
  p2_24c_canonical_result_modified: false
  p2_25_canonical_result_modified: false
planned_scoring:
  unit: parsed_event
  corpus_scope: all parseable EVTX members frozen in the phase-B inventory
  flagged_event_definition: a parsed source-intent benign event with one or more detector findings
  aggregate: unique_flagged_events / parsed_events
  name: observed_source_intent_benign_flagged_event_fraction
  confirmed_false_positive_rate: NOT_MEASURED
  production_false_positive_rate: NOT_CLAIMED
  per_rule_counts: DIAGNOSTIC_ONLY
  parse_errors: REPORTED_SEPARATELY
claim_boundary:
  fresh_benign_revalidation: NOT_YET_MEASURED
  source_intent_benign: SUPPORTED_BY_UPSTREAM_README
  event_level_benign_ground_truth: NOT_AVAILABLE
  confirmed_false_positive_rate: NOT_CLAIMED
  production_false_positive_rate: NOT_CLAIMED
  production_accuracy: NOT_CLAIMED
  production_recall: NOT_CLAIMED
