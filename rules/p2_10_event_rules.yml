- id: R-SCHTASK-4698
  name: Scheduled Task Creation Event
  description: Windows Security 4698 scheduled task creation event
  field: event_id
  operator: equals
  pattern: "4698"
  severity: low
  mitre_technique: T1053.005
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Security-Auditing

- id: R-WMI-XSL-Format
  name: WMI XSL Format Execution
  description: WMIC process listing with XSL format execution pattern
  field: command_line
  operator: contains
  pattern: "wmic"
  severity: low
  mitre_technique: T1047
  all_of:
    - field: command_line
      operator: contains
      pattern: "/format:"
    - field: event_id
      operator: equals
      pattern: "1"
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
