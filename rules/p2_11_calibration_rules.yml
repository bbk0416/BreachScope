- id: R-LOCAL-ACCOUNT-4720-NONSYSTEM
  name: Local Account Creation by Non-System Principal
  description: Security 4720 account creation where the creating principal is not SYSTEM and TargetDomainName matches the local host
  field: event_id
  operator: equals
  pattern: "4720"
  severity: medium
  mitre_technique: T1136.001
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Security-Auditing
    - field: SubjectUserSid
      operator: regex
      pattern: '^(?!S-1-5-18$).+'
    - field: TargetDomainName
      operator: equals_field
      pattern: host

- id: R-SERVICE-DISCOVERY-SC-LIST
  name: Service Discovery via SC Query Listing
  description: Sysmon process creation for sc.exe listing services with query or query state=all, excluding named-service queries
  field: Image
  operator: endswith
  pattern: '\sc.exe'
  severity: low
  mitre_technique: T1007
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"
    - field: command_line
      operator: regex
      pattern: '\bsc(?:\.exe)?"?\s+query(?:\s+state\s*=\s*all)?\s*$'

- id: R-SERVICE-DISCOVERY-NET-START-LIST
  name: Service Discovery via Net Start Listing
  description: Sysmon process creation for net.exe or net1.exe listing started services with no service-name argument
  field: Image
  operator: regex
  pattern: '\\net1?\.exe$'
  severity: low
  mitre_technique: T1007
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"
    - field: command_line
      operator: regex
      pattern: '\bnet1?(?:\.exe)?"?\s+start\s*$'

- id: R-DIRECT-VOLUME-POWERSHELL-FILESTREAM-READ
  name: PowerShell Raw Volume FileStream Read Command
  description: Sysmon process creation where PowerShell or Pwsh invokes FileStream with Open and Read semantics against a DOS raw logical-volume device path
  field: command_line
  operator: regex
  pattern: '\\{2}\.\\[A-Za-z]:'
  severity: medium
  mitre_technique: T1006
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"
    - field: Image
      operator: regex
      pattern: '\\(?:powershell|pwsh)\.exe$'
    - field: command_line
      operator: regex
      pattern: '(?:System\.)?IO\.FileStream|\bFileStream\b'
    - field: command_line
      operator: regex
      pattern: '\bOpen\b'
    - field: command_line
      operator: regex
      pattern: '\bRead\b'
