name: P2-11G Rule Freeze Probe

on:
  push:
    branches: [measure/p2-11g-t1027-calibration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control

      - name: Checkout exact detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: e876ce32c6b5c9846ca553b03a291548a7a7aa93
          path: detector

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt

      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector

      - name: Run focused tests and freeze
        run: |
          cd detector
          python -m pytest -q tests/test_p2_11g_encoded_powershell_mapping.py
          python scripts/run.py --validate-rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "$RUNNER_TEMP/p2-11g-rules-freeze.json"
          cat "$RUNNER_TEMP/p2-11g-rules-freeze.json"

      - name: Verify unchanged rule tree
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "p2-11g-rules-freeze.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["repo_commit"] == "e876ce32c6b5c9846ca553b03a291548a7a7aa93"
          assert data["rules_tree_sha256"] == "1626aca8b7b9a8e2a7e1f42360c65b504827ff43e52159eb3716613ebb540a50"
          assert int(data["rule_file_count"]) == 4
          print("P2_11G_RULE_TREE_UNCHANGED=PASS")
          PY

      - name: Upload freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11g-rules-freeze
          path: ${{ runner.temp }}/p2-11g-rules-freeze.json
          if-no-files-found: error
          retention-days: 30
