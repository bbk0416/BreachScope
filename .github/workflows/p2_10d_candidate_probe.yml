name: P2-10D Candidate Benign Probe

on:
  push:
    branches:
      - probe/p2-10d-lsass-benign

permissions:
  contents: read

jobs:
  attack-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 521043690ea502b9ca5318e68b40c790af59bad2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Prove attack candidate predicates
        run: |
          python scripts/run_external_baseline.py --out out/p2_10d_attack --timeout 120
          python - <<'PY'
          from pathlib import Path
          from scripts.evaluate_external_holdout import _convert_one_evtx

          corpus = Path('out/p2_10d_attack/corpus')

          lsass = _convert_one_evtx(corpus / 'evtx-ca-lsass-mimikatz.evtx')
          assert len(lsass) == 1
          row = lsass[0]
          raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
          assert str(row.get('source') or '') == 'Microsoft-Windows-Sysmon'
          assert str(row.get('event_id') or '') == '10'
          assert str(raw.get('TargetImage') or '').casefold().endswith('\\lsass.exe')
          assert str(raw.get('GrantedAccess') or '').casefold() in {'0x00001010', '0x1010'}
          print('ATTACK_LSASS exact=1 source_image=' + str(raw.get('SourceImage') or ''))

          ps = _convert_one_evtx(corpus / 'evtx-lm-powershell-remoting.evtx')
          assert len(ps) == 1
          row = ps[0]
          raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
          assert str(row.get('source') or '') == 'Microsoft-Windows-Sysmon'
          assert str(row.get('event_id') or '') == '1'
          assert str(raw.get('ParentImage') or '').casefold().endswith('\\wsmprovhost.exe')
          print('ATTACK_POWERSHELL_REMOTING exact=1 parent=' + str(raw.get('ParentImage') or ''))

          runkey = _convert_one_evtx(corpus / 'evtx-persist-hidden-run-key.evtx')
          assert len(runkey) == 1
          row = runkey[0]
          raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
          assert str(row.get('source') or '') == 'Microsoft-Windows-Sysmon'
          assert str(row.get('event_id') or '') == '13'
          target = str(raw.get('TargetObject') or '').casefold()
          assert '\\software\\microsoft\\windows\\currentversion\\run\\' in target
          assert str(raw.get('EventType') or '').casefold() == 'setvalue'
          print('ATTACK_RUNKEY exact=1 target=' + str(raw.get('TargetObject') or ''))
          PY

  benign-shard:
    needs: attack-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            start: 0
            end: 1486
          - shard: 1
            start: 1486
            end: 2973
          - shard: 2
            start: 2973
            end: 4459
          - shard: 3
            start: 4459
            end: 5946
          - shard: 4
            start: 5946
            end: 7433
          - shard: 5
            start: 7433
            end: 8920
          - shard: 6
            start: 8920
            end: 10407
          - shard: 7
            start: 10407
            end: 11894
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 521043690ea502b9ca5318e68b40c790af59bad2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Scan pinned benign Sysmon candidate predicates
        env:
          SHARD: ${{ matrix.shard }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u - <<'PY'
          import hashlib
          import os
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          import yaml
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          shard = int(os.environ['SHARD'])
          start = int(os.environ['START'])
          end = int(os.environ['END'])
          recipe = yaml.safe_load(Path('external_baseline/p2_09d_benign_sources.yaml').read_text(encoding='utf-8'))
          source = recipe['source']
          work = Path(tempfile.mkdtemp(prefix=f'p2-10d-{shard}-'))
          archive = work / source['asset_name']
          request = urllib.request.Request(source['asset_url'], headers={'User-Agent': 'BreachScope-P2-10D/1.0'})
          with urllib.request.urlopen(request, timeout=300) as response, archive.open('wb') as out:
              shutil.copyfileobj(response, out, length=1024 * 1024)
          assert archive.stat().st_size == int(source['size'])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == source['sha256'], digest

          target = work / 'sysmon.evtx'
          with tarfile.open(archive, 'r:gz') as tf:
              member = tf.getmember('Logs_Client/Microsoft-Windows-Sysmon%4Operational.evtx')
              src = tf.extractfile(member)
              assert src is not None
              with src, target.open('wb') as out:
                  shutil.copyfileobj(src, out, length=1024 * 1024)

          texts = ['lsass.exe', 'wsmprovhost.exe', 'currentversion\\run']
          needles = []
          for text in texts:
              needles.extend([text.encode('ascii'), text.encode('utf-16le')])

          records = 0
          raw_candidates = 0
          lsass_target = 0
          lsass_1010 = 0
          wsm_parent = 0
          runkey_path = 0
          runkey_setvalue = 0
          examples = {'lsass': [], 'wsm': [], 'runkey': []}

          with Evtx(str(target)) as log:
              chunks = list(log.chunks())
              assert len(chunks) == 11894, len(chunks)
              for chunk_index in range(start, end):
                  for record in chunks[chunk_index].records():
                      records += 1
                      data = record.data().lower()
                      if not any(needle in data for needle in needles):
                          continue
                      raw_candidates += 1
                      row = _extract_from_xml(record.xml())
                      if not row or str(row.get('source') or '') != 'Microsoft-Windows-Sysmon':
                          continue
                      event_id = str(row.get('event_id') or '')
                      raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}

                      if event_id == '10':
                          target_image = str(raw.get('TargetImage') or '').casefold()
                          if target_image.endswith('\\lsass.exe'):
                              lsass_target += 1
                              access = str(raw.get('GrantedAccess') or '').casefold()
                              if access in {'0x00001010', '0x1010'}:
                                  lsass_1010 += 1
                                  if len(examples['lsass']) < 3:
                                      examples['lsass'].append((raw.get('SourceImage'), raw.get('GrantedAccess')))

                      if event_id == '1':
                          parent = str(raw.get('ParentImage') or '').casefold()
                          if parent.endswith('\\wsmprovhost.exe'):
                              wsm_parent += 1
                              if len(examples['wsm']) < 3:
                                  examples['wsm'].append((raw.get('Image'), raw.get('CommandLine')))

                      if event_id == '13':
                          target_object = str(raw.get('TargetObject') or '').casefold()
                          if '\\software\\microsoft\\windows\\currentversion\\run\\' in target_object:
                              runkey_path += 1
                              if str(raw.get('EventType') or '').casefold() == 'setvalue':
                                  runkey_setvalue += 1
                                  if len(examples['runkey']) < 3:
                                      examples['runkey'].append((raw.get('TargetObject'), raw.get('Details'), raw.get('Image')))

          print(f'P2_10D_SHARD={shard}')
          print(f'chunk_range={start}:{end}')
          print(f'records={records}')
          print(f'raw_candidates={raw_candidates}')
          print(f'lsass_event10_target={lsass_target}')
          print(f'lsass_event10_target_access1010={lsass_1010}')
          print(f'wsmprovhost_parent_event1={wsm_parent}')
          print(f'runkey_event13_path={runkey_path}')
          print(f'runkey_event13_setvalue={runkey_setvalue}')
          print(f'examples={examples!r}')
          shutil.rmtree(work, ignore_errors=True)
          PY
