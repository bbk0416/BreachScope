name: P2-10C Candidate Probe

on:
  push:
    branches:
      - measure/p2-10c-candidate-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c910ab5a3f82efbbc6f3442172ff1a7c17d4eb2c
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Build attack event index on exact main
        run: python scripts/run_external_baseline.py --out out/p2_10c_probe --timeout 120
      - name: Print normalized identities for remaining misses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          misses = {
              'evtx-ca-lsass-mimikatz.evtx',
              'evtx-lm-powershell-remoting.evtx',
              'evtx-lm-wmi.evtx',
              'evtx-lm-remote-service.evtx',
              'evtx-persist-hidden-run-key.evtx',
              'evtx-discovery-domain-admins.evtx',
          }
          counts = {name: 0 for name in misses}
          for line in Path('out/p2_10c_probe/event_index.jsonl').read_text(encoding='utf-8').splitlines():
              row = json.loads(line)
              source = row['source_file']
              if source not in misses:
                  continue
              counts[source] += 1
              identity = row['identity']
              raw = row.get('raw') or {}
              canonical = raw.get('canonical') if isinstance(raw, dict) else None
              data = raw.get('event_data') if isinstance(raw, dict) else None
              print('===', source, 'record', row['record_index'], '===')
              print('identity=' + json.dumps(identity, ensure_ascii=False, sort_keys=True))
              if isinstance(canonical, dict):
                  interesting = {k:v for k,v in canonical.items() if v not in ('', None)}
                  print('canonical=' + json.dumps(interesting, ensure_ascii=False, sort_keys=True))
              if isinstance(data, dict):
                  interesting = {k:v for k,v in data.items() if v not in ('', None)}
                  print('event_data=' + json.dumps(interesting, ensure_ascii=False, sort_keys=True))
          print('COUNTS=' + json.dumps(counts, sort_keys=True))
          assert counts == {
              'evtx-ca-lsass-mimikatz.evtx': 1,
              'evtx-lm-powershell-remoting.evtx': 1,
              'evtx-lm-wmi.evtx': 8,
              'evtx-lm-remote-service.evtx': 3,
              'evtx-persist-hidden-run-key.evtx': 1,
              'evtx-discovery-domain-admins.evtx': 63,
          }, counts
          PY
