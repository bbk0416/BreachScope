name: P2-10C Candidate Probe

on:
  push:
    branches:
      - measure/p2-10c-candidate-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c910ab5a3f82efbbc6f3442172ff1a7c17d4eb2c
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Build attack event index on exact main
        run: python scripts/run_external_baseline.py --out out/p2_10c_probe --timeout 120
      - name: Print deep normalized fields for remaining misses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.evaluate_external_holdout import _convert_one_evtx

          names = [
              'evtx-ca-lsass-mimikatz.evtx',
              'evtx-lm-powershell-remoting.evtx',
              'evtx-lm-wmi.evtx',
              'evtx-lm-remote-service.evtx',
              'evtx-persist-hidden-run-key.evtx',
              'evtx-discovery-domain-admins.evtx',
          ]
          for name in names:
              rows = _convert_one_evtx(Path('out/p2_10c_probe/corpus') / name)
              print(f'### {name} rows={len(rows)}')
              for idx, row in enumerate(rows, 1):
                  event_id = str(row.get('event_id') or '')
                  if name == 'evtx-discovery-domain-admins.evtx' and event_id != '4661':
                      continue
                  raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
                  canonical = raw.get('canonical') if isinstance(raw.get('canonical'), dict) else {}
                  event_data = raw.get('event_data') if isinstance(raw.get('event_data'), dict) else {}
                  interesting = {
                      'timestamp': row.get('timestamp'),
                      'host': row.get('host'),
                      'source': row.get('source'),
                      'event_id': row.get('event_id'),
                      'user': row.get('user'),
                      'command_line': row.get('command_line'),
                      'canonical': canonical,
                      'event_data': event_data,
                  }
                  print(f'ROW {idx} ' + json.dumps(interesting, ensure_ascii=False, sort_keys=True))
          PY
