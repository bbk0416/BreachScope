name: P2-10H Implementation Builder

on:
  push:
    branches:
      - measure/p2-10h-impl-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Preserve patch helper and switch target branch
        run: |
          cp scripts/_p2_10h_apply_impl.py /tmp/p2_10h_apply_impl.py
          git fetch origin fix/p2-10h-wmi-parent-correlation
          git switch fix/p2-10h-wmi-parent-correlation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact locked environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Apply implementation patch
        run: python /tmp/p2_10h_apply_impl.py

      - name: Validate implementation before push
        run: |
          python -m compileall -q breachscope tests/test_p2_10h_wmi_parent_correlation.py
          pytest -q tests/test_p2_10h_wmi_parent_correlation.py tests/test_analyzer.py
          python -m breachscope.cli --rules rules --validate-rules
          git diff --check

      - name: Commit and push target branch
        run: |
          git config user.name "P2-10H Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add breachscope/analyzer.py rules/p2_10_event_rules.yml tests/test_p2_10h_wmi_parent_correlation.py
          git commit -m "feat: detect WMI provider child processes"
          git push origin HEAD:fix/p2-10h-wmi-parent-correlation
