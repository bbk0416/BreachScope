name: P2-10D LSASS Access Measurement

on:
  push:
    branches:
      - measure/p2-10d-lsass-1010

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Focused rule tests
        run: python -m pytest -q tests/test_p2_10_lsass_rule.py
      - name: Run pinned external attack baseline
        run: python scripts/run_external_baseline.py --out out/p2_10d_attack --timeout 120
      - name: Assert attack-side improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('out/p2_10d_attack/summary.json').read_text(encoding='utf-8'))
          metrics = summary['primary_metrics']
          outcomes = {row['scenario_id']: row for row in summary['scenarios']}

          assert metrics['scenario_hits'] == 6, metrics
          assert metrics['scenario_misses'] == 4, metrics
          assert metrics['scenario_total'] == 10, metrics

          target = outcomes['ca-lsass-mimikatz']
          assert target['status'] == 'hit', target
          assert 'T1003.001' in target['matched_techniques'], target

          for scenario_id in (
              'lm-powershell-remoting',
              'lm-wmi',
              'lm-remote-service',
              'persist-hidden-run-key',
          ):
              assert outcomes[scenario_id]['status'] == 'miss', outcomes[scenario_id]

          print('P2-10D attack delta: PASS 5/10 -> 6/10')
          print('rules_tree_sha256=' + summary['rules_tree_sha256'])
          print('findings=' + str(summary['detection_observation']['findings']))
          print('flagged_events=' + str(summary['detection_observation']['flagged_events']))
          print('runtime_seconds=' + str(summary['performance']['runtime_seconds']))
          print('peak_memory_mb=' + str(summary['performance']['peak_memory_mb']))
          PY
      - name: Write measurement record
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml

          summary = json.loads(Path('out/p2_10d_attack/summary.json').read_text(encoding='utf-8'))
          payload = {
              'schema': 'breachscope.p2_10d_measurement.v1',
              'evaluated_repo_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'from_rules_tree_sha256': '9fff876a481f972ac88dcccb1044b38b8df22c390f74375034a72eca7a1a8fa0',
              'to_rules_tree_sha256': summary['rules_tree_sha256'],
              'change': {
                  'rule_id': 'R-LSASS-ACCESS-1010',
                  'mitre_technique': 'T1003.001',
                  'predicate': {
                      'source_equals': 'Microsoft-Windows-Sysmon',
                      'event_id_equals': '10',
                      'TargetImage_endswith': r'\lsass.exe',
                      'GrantedAccess_regex': '^0x0*1010$',
                  },
              },
              'attack_external_baseline': {
                  'before_scenario_hits': 5,
                  'scenario_hits': summary['primary_metrics']['scenario_hits'],
                  'scenario_misses': summary['primary_metrics']['scenario_misses'],
                  'scenario_total': summary['primary_metrics']['scenario_total'],
                  'findings': summary['detection_observation']['findings'],
                  'flagged_events': summary['detection_observation']['flagged_events'],
                  'changed_scenario': 'ca-lsass-mimikatz',
              },
              'benign_incremental_match_proof': {
                  'baseline_id': 'p2-09d-nextron-win10-v1',
                  'corpus_sha256': 'd48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e',
                  'sysmon_records_scanned': 732200,
                  'sysmon_chunks_scanned': 11894,
                  'lsass_event10_target_matches': 61,
                  'exact_predicate_matches': 0,
                  'probe_run_id': 34243188619,
                  'fresh_full_fp_tn_rerun': False,
              },
              'claim_boundary': {
                  'production_detection_rate': 'NOT_CLAIMED',
                  'production_false_positive_rate': 'NOT_CLAIMED',
                  'fresh_full_benign_fpr_for_new_rulepack': 'NOT_CLAIMED',
                  'final_blind_holdout': False,
              },
          }
          Path('out/p2_10d_measurement.yaml').write_text(
              yaml.safe_dump(payload, sort_keys=False, allow_unicode=True),
              encoding='utf-8',
          )
          PY
      - name: Upload measurement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-10d-lsass-measurement
          path: |
            out/p2_10d_attack/rules_freeze.json
            out/p2_10d_attack/manifest.yaml
            out/p2_10d_attack/result.json
            out/p2_10d_attack/summary.json
            out/p2_10d_attack/SUMMARY.md
            out/p2_10d_measurement.yaml
          if-no-files-found: error
