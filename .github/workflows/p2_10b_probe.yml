name: P2-10B WMI XSL Probe

on:
  push:
    branches:
      - measure/p2-10b-wmi-xsl

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Materialize pinned WMI samples
        run: |
          python scripts/run_external_baseline.py \
            --asset evtx-exec-wmi-xsl \
            --asset evtx-lm-wmi \
            --out out/p2_10b_probe \
            --timeout 120

      - name: Inspect normalized WMI events
        run: |
          python - <<'PY'
          from pathlib import Path
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          root = Path("out/p2_10b_probe/corpus")
          for path in sorted(root.glob("*.evtx")):
              print(f"=== {path.name} ===")
              with Evtx(str(path)) as log:
                  for i, record in enumerate(log.records(), 1):
                      row = _extract_from_xml(record.xml())
                      if not row:
                          continue
                      print({
                          "n": i,
                          "source": row.get("source"),
                          "event_id": row.get("event_id"),
                          "image": row.get("image"),
                          "parent_image": row.get("parent_image"),
                          "command_line": row.get("command_line"),
                      })
          PY
