name: P2-14E Final Blind One-Pass Scoring

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN-P2-14E-CANONICAL-ONCE to execute the single canonical scoring run'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: p2-14e-final-blind-one-pass
  cancel-in-progress: false

jobs:
  score-once:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce canonical invocation guard
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$RUN_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'RUN-P2-14E-CANONICAL-ONCE'

      - name: Checkout control repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control

      - name: Checkout frozen detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13eb8f6ac93cf29817ca3ed885e8dc18b8fbb2fb
          path: detector

      - name: Set up frozen Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt

      - name: Install frozen detector dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt

      - name: Download byte-bound final holdout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output final-holdout.tar.gz \
            'https://codeload.github.com/sbousseaden/EVTX-ATTACK-SAMPLES/tar.gz/4ceed2f4706daf601c212a8f91c113dd85349a2c'

      - name: Execute canonical detector exactly once
        shell: bash
        run: |
          set -euo pipefail
          python control/scripts/p2_14e_one_pass_blind_score.py \
            --detector-root detector \
            --archive final-holdout.tar.gz \
            --out p2_14e_result.json
          sha256sum p2_14e_result.json > p2_14e_result.file.sha256
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'control_sha': os.environ['GITHUB_SHA'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
          }
          Path('p2_14e_run_metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload canonical scoring evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: p2-14e-final-blind-one-pass-result
          path: |
            p2_14e_result.json
            p2_14e_result.file.sha256
            p2_14e_run_metadata.json
          if-no-files-found: error
          retention-days: 90
