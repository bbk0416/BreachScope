name: P2-13B Win11 Benign Byte Binding V4 Recovery

on:
  push:
    branches:
      - measure/p2-13b-win11-benign-binding-v4-recovery
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the 16 successful source shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: p2-13b-win11-chunk-shard-*
          path: shards
          merge-multiple: true
          run-id: 34680672963
          github-token: ${{ github.token }}
      - name: Recover aggregate and fail closed
        run: |
          python scripts/p2_13b_win11_benign_binding_v4_recover.py \
            --inputs shards \
            --shards 16 \
            --output p2_13b_win11_benign_binding.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p2_13b_win11_benign_binding.json').read_text())
          assert d['archive_sha256']=='739079e63fc8a81d0b20eff6ee76b2f104a0cf6df115802c9bca128417c1e117'
          assert d['evtx_files']==381
          assert d['evtx_chunks']==39927
          assert d['total_records']==1741090
          assert d['sysmon_records']==1425626
          assert d['sysmon_event1']==2302
          assert d['parse_errors']==51
          assert d['detector_imported'] is False
          assert d['detector_executed'] is False
          assert d['results_consulted'] is False
          assert d['source_shard_run_id']==34680672963
          assert d['claim_boundary']['production_false_positive_rate']=='NOT_CLAIMED'
          print('P2_13B_V4_RECOVERY_FAIL_CLOSED=PASS')
          PY
      - name: Upload canonical recovered aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-13b-win11-benign-binding-v4-recovered
          path: p2_13b_win11_benign_binding.json
          if-no-files-found: error
