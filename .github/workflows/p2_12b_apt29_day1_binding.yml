name: P2-12B APT29 Day 1 Byte and Label Binding

on:
  push:
    branches:
      - evidence/p2-12b-apt29-day1-byte-label-binding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreachScope
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install binding dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download exact pinned OTRF source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p2_12b_source p2_12b_out
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/compound/apt29/day1/apt29_evals_day1_manual.zip' \
            --output p2_12b_source/apt29_evals_day1_manual.zip
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/compound/apt29/emulationplans/apt29.xlsx' \
            --output p2_12b_source/apt29.xlsx
          test "$(stat -c %s p2_12b_source/apt29_evals_day1_manual.zip)" = "13944973"
          test "$(stat -c %s p2_12b_source/apt29.xlsx)" = "25051"

      - name: Bind bytes and extract source labels without detection
        run: |
          python scripts/p2_12b_bind_apt29_day1.py \
            --archive p2_12b_source/apt29_evals_day1_manual.zip \
            --plan p2_12b_source/apt29.xlsx \
            --out p2_12b_out

      - name: Assert no detector execution in binding output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('p2_12b_out/binding-probe.json').read_text(encoding='utf-8'))
          assert p['protocol']['detector_executed'] is False
          assert p['protocol']['detector_results_consulted'] is False
          print('P2_12B_NO_DETECTION=PASS')
          PY

      - name: Upload binding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p2-12b-apt29-day1-binding
          path: p2_12b_out/
          if-no-files-found: error
          retention-days: 30
