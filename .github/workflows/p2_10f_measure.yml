name: P2-10F External Baseline Measure

on:
  push:
    branches:
      - measure/p2-10f-remote-service

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Record exact source
        run: |
          git rev-parse HEAD
          git status --short
          git hash-object rules/p2_10_event_rules.yml

      - name: Run external attack baseline
        run: python scripts/run_external_baseline.py --out out/p2_10f_measure --timeout 120

      - name: Upload measurement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10f-external-baseline
          path: out/p2_10f_measure
          if-no-files-found: error
