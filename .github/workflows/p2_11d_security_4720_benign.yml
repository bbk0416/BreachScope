name: P2-11D Security 4720 Benign Scan

on:
  push:
    branches:
      - analysis/p2-11d-security-4720-benign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install scan dependencies
        run: python -m pip install python-evtx==0.8.1 PyYAML==6.0.3

      - name: Download pinned Nextron benign corpus
        run: |
          curl --fail --location --retry 3 --output win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          test "$(stat -c %s win10-client.tgz)" = "70844052"
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  win10-client.tgz" | sha256sum --check --strict
          mkdir corpus
          tar -xzf win10-client.tgz -C corpus

      - name: Count Security 4720 in pinned benign corpus
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/p2_11d_scan_security_4720.py \
            --root corpus \
            --out out/p2_11d/security-4720-benign.json
          cat out/p2_11d/security-4720-benign.json

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-11d-security-4720-benign
          path: out/p2_11d/security-4720-benign.json
          if-no-files-found: error
          retention-days: 90
