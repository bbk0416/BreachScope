name: P2-13B Win11 Benign Byte Binding V2

on:
  push:
    branches:
      - measure/p2-13b-win11-benign-binding-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact control head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install EVTX parser
        run: python -m pip install --disable-pip-version-check python-evtx==0.8.1

      - name: Download and verify selected archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o win11-client-2023.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win11-client-2023.tgz
          test "$(stat -c%s win11-client-2023.tgz)" = "169460461"
          echo "739079e63fc8a81d0b20eff6ee76b2f104a0cf6df115802c9bca128417c1e117  win11-client-2023.tgz" | sha256sum -c -

      - name: Extract archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf win11-client-2023.tgz -C extracted

      - name: Bind bytes and inventory EVTX in parallel
        run: |
          python scripts/p2_13b_bind_win11_benign_v2.py \
            win11-client-2023.tgz extracted p2_13b_win11_benign_binding.json

      - name: Fail closed on no-detector protocol
        shell: python
        run: |
          import json
          from pathlib import Path
          d = json.loads(Path('p2_13b_win11_benign_binding.json').read_text(encoding='utf-8'))
          assert d['source']['archive_sha256'] == '739079e63fc8a81d0b20eff6ee76b2f104a0cf6df115802c9bca128417c1e117'
          assert d['source']['asset_size_bytes'] == 169460461
          assert d['inventory']['evtx_file_count'] > 0
          assert d['inventory']['total_records'] > 0
          assert d['protocol']['detector_imported'] is False
          assert d['protocol']['detector_executed'] is False
          assert d['protocol']['detector_results_consulted'] is False
          assert d['claim_boundary']['production_false_positive_rate'] == 'NOT_CLAIMED'
          print('P2_13B_FAIL_CLOSED=PASS')

      - name: Upload byte-binding artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-13b-win11-benign-binding-v2
          path: p2_13b_win11_benign_binding.json
          if-no-files-found: error
