name: P2-10H WMI Benign Parent Scan

on:
  push:
    branches:
      - measure/p2-10h-wmi-benign

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run pinned benign WMI parent scan
        run: |
          mkdir -p out/p2_10h_wmi_benign_evidence
          python scripts/p2_10h_scan_benign_wmi_parent.py | tee out/p2_10h_wmi_benign_evidence/scan.log

      - name: Upload benign scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10h-wmi-benign-evidence
          path: out/p2_10h_wmi_benign_evidence/scan.log
          if-no-files-found: error
