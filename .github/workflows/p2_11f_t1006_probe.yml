name: P2-11F T1006 Probe

on:
  push:
    branches: [analysis/p2-11f-t1006-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreachScope analysis branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Checkout pinned Atomic EVTX source
        run: |
          git clone --filter=blob:none https://github.com/arniki/atomic-evtx.git atomic-evtx
          git -C atomic-evtx checkout --detach 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C atomic-evtx rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"
          test -d atomic-evtx/ttp_evtx/T1006-1

      - name: Probe exact T1006 attack forms
        run: |
          python scripts/p2_11f_t1006_attack_probe.py atomic-evtx --out out/p2_11f_t1006_attack_probe.json
          sha256sum out/p2_11f_t1006_attack_probe.json

      - name: Upload attack probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11f-t1006-attack-probe
          path: out/p2_11f_t1006_attack_probe.json
          if-no-files-found: error
          retention-days: 30

  benign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreachScope analysis branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Download and verify pinned benign corpus
        run: |
          curl --fail --location --retry 3 --output win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          test "$(stat -c %s win10-client.tgz)" = "70844052"
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  win10-client.tgz" | sha256sum -c -
          mkdir benign
          tar -xzf win10-client.tgz -C benign
          test "$(find benign -type f -iname '*.evtx' | wc -l)" = "352"

      - name: Probe T1006 benign candidate frequency
        run: |
          mapfile -t SYSMON_FILES < <(find benign -type f -iname '*sysmon*.evtx' | sort)
          if [ "${#SYSMON_FILES[@]}" -ne 1 ]; then
            printf 'Expected exactly one Sysmon EVTX, got %s\n' "${#SYSMON_FILES[@]}"
            printf '%s\n' "${SYSMON_FILES[@]}"
            exit 1
          fi
          python scripts/p2_11f_t1006_benign_probe.py "${SYSMON_FILES[0]}" --workers 4 --out out/p2_11f_t1006_benign_probe.json
          sha256sum out/p2_11f_t1006_benign_probe.json

      - name: Upload benign probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11f-t1006-benign-probe
          path: out/p2_11f_t1006_benign_probe.json
          if-no-files-found: error
          retention-days: 30
