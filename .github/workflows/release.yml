name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional version label for a manual release build
        required: false
        default: manual

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch pinned historical detection evidence commit
        run: git fetch --no-tags origin bad0c88037d489f5b375c120002be74ac6082ffa

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum fontconfig
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Test before release
        run: |
          python -m compileall -q breachscope api scripts tests
          pytest -q
          python scripts/run.py --demo-scenario all --out out_release/report --export-json --export-csv --pdf
          python scripts/run.py --validate-rules

      - name: Build source release bundle
        env:
          BS_BUILD_SHA: ${{ github.sha }}
          BS_BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
        run: python scripts/build_release.py --clean

      - name: Build Python package
        run: python -m build --no-isolation

      - name: Add Python distribution checksums and refresh manifest
        env:
          BS_BUILD_SHA: ${{ github.sha }}
          BS_BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          BS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.BS_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from breachscope.release import ReleaseArtifact, sha256_file, write_release_manifest
          from breachscope.release_signing import (
              DEFAULT_SIGNATURE_NAME,
              release_signing_key_configured,
              sign_release_manifest,
          )

          dist = Path("dist")
          artifacts = []
          for path in sorted(dist.glob("*")):
              if path.name in {
                  "SHA256SUMS.txt",
                  "release_manifest.json",
                  DEFAULT_SIGNATURE_NAME,
              } or path.is_dir():
                  continue
              artifacts.append(
                  ReleaseArtifact(
                      path=str(path),
                      size_bytes=path.stat().st_size,
                      sha256=sha256_file(path),
                  )
              )

          checksums = dist / "SHA256SUMS.txt"
          checksums.write_text(
              "\n".join(f"{artifact.sha256} {Path(artifact.path).name}" for artifact in artifacts) + "\n",
              encoding="utf-8",
          )
          artifacts.append(
              ReleaseArtifact(
                  path=str(checksums),
                  size_bytes=checksums.stat().st_size,
                  sha256=sha256_file(checksums),
              )
          )
          manifest = write_release_manifest(
              ".",
              artifacts,
              dist / "release_manifest.json",
          )
          signature_path = dist / DEFAULT_SIGNATURE_NAME
          if release_signing_key_configured():
              sign_release_manifest(manifest.path, signature_path)
          else:
              signature_path.unlink(missing_ok=True)
          PY

      - name: Verify release manifest signature when present
        run: |
          if [ -f dist/release_manifest.sig.json ]; then
            python scripts/verify_release_signature.py --manifest dist/release_manifest.json --signature dist/release_manifest.sig.json
          else
            echo "Release signing disabled: no detached signature generated."
          fi

      - name: Upload release build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: breachscope-release-artifacts
          retention-days: 1
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
