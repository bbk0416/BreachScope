name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional version label for a manual release build
        required: false
        default: manual

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum fontconfig
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Test before release
        run: |
          python -m compileall -q breachscope api scripts tests
          pytest -q
          python scripts/run.py --demo-scenario all --out out_release/report --export-json --export-csv --pdf
          python scripts/run.py --validate-rules

      - name: Build source release bundle
        env:
          BS_BUILD_SHA: ${{ github.sha }}
          BS_BUILD_TAG: ${{ github.ref_name }}
          BS_BUILD_VERSION: ${{ github.ref_name }}
        run: python scripts/build_release.py --clean

      - name: Build Python package
        run: python -m build --no-isolation

      - name: Add Python distribution checksums and refresh manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from breachscope.release import ReleaseArtifact, sha256_file, write_release_manifest

          dist = Path("dist")
          artifacts = []
          for path in sorted(dist.glob("*")):
              if path.name in {"SHA256SUMS.txt", "release_manifest.json"} or path.is_dir():
                  continue
              artifacts.append(
                  ReleaseArtifact(
                      path=str(path),
                      size_bytes=path.stat().st_size,
                      sha256=sha256_file(path),
                  )
              )

          checksums = dist / "SHA256SUMS.txt"
          checksums.write_text(
              "\n".join(f"{artifact.sha256} {Path(artifact.path).name}" for artifact in artifacts) + "\n",
              encoding="utf-8",
          )
          artifacts.append(
              ReleaseArtifact(
                  path=str(checksums),
                  size_bytes=checksums.stat().st_size,
                  sha256=sha256_file(checksums),
              )
          )
          write_release_manifest(".", artifacts, dist / "release_manifest.json")
          PY

      - name: Upload release build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breachscope-release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true

