name: P2-11J Rule Freeze

on:
  push:
    branches: [measure/p2-11j-t1003-networkprovider-calibration]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
      - name: Checkout exact P2-11J detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 357b7ea88c5949d899ec637c95f56bad61605f3c
          path: detector
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt
      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector
      - name: Run focused tests and freeze
        run: |
          cd detector
          python -m pytest -q tests/test_p2_11j_networkprovider_rule.py
          python scripts/run.py --validate-rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "$RUNNER_TEMP/p2-11j-rules-freeze.json"
      - name: Verify exact P2-11J detector freeze
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'p2-11j-rules-freeze.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['repo_commit'] == '357b7ea88c5949d899ec637c95f56bad61605f3c'
          assert data['rules_tree_sha256'] == '9f823a189530528a47b11c5519b02dc9b97473b8c0f6a8e0c13e1ed8d04b5e92'
          assert int(data['rule_file_count']) == 4
          print('P2_11J_RULE_FREEZE=PASS')
          PY
      - name: Upload freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-11j-rules-freeze
          path: ${{ runner.temp }}/p2-11j-rules-freeze.json
          if-no-files-found: error
          retention-days: 90
