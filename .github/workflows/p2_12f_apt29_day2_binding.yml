name: P2-12F APT29 Day 2 Byte and Label Binding

on:
  push:
    branches:
      - measure/p2-12f-apt29-day2-binding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreachScope
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install binding dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Download exact pinned Day 2 and plan bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p2_12f_source p2_12f_out
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/compound/apt29/day2/apt29_evals_day2_manual.zip' \
            --output p2_12f_source/apt29_evals_day2_manual.zip
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/compound/apt29/emulationplans/apt29.xlsx' \
            --output p2_12f_source/apt29.xlsx
          test "$(stat -c %s p2_12f_source/apt29_evals_day2_manual.zip)" = "43033041"
          test "$(stat -c %s p2_12f_source/apt29.xlsx)" = "25051"

      - name: Bind Day 2 bytes and labels without detection
        run: |
          python scripts/p2_12f_bind_apt29_day2.py \
            --archive p2_12f_source/apt29_evals_day2_manual.zip \
            --plan p2_12f_source/apt29.xlsx \
            --out p2_12f_out

      - name: Fail closed on protocol state
        shell: python
        run: |
          import json
          from pathlib import Path
          d = json.loads(Path('p2_12f_out/binding-probe.json').read_text(encoding='utf-8'))
          assert d['evaluation_class'] == 'confirmatory_same_campaign_holdout_pre_scoring'
          assert d['protocol']['detector_executed'] is False
          assert d['protocol']['detector_imported'] is False
          assert d['protocol']['detector_results_consulted'] is False
          assert d['archive']['actual_parse']['total_events'] > 0
          assert d['archive']['actual_parse']['parse_errors'] == 0
          assert d['emulation_plan']['selected_sheet'].lower() == 'day2'
          assert d['emulation_plan']['unique_technique_count'] > 0
          print('P2_12F_FAIL_CLOSED=PASS')

      - name: Upload binding artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-12f-apt29-day2-binding
          path: p2_12f_out/binding-probe.json
          if-no-files-found: error
          retention-days: 30
