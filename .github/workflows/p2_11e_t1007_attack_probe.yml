name: P2-11E T1007 Attack Probe

on:
  push:
    branches: [analysis/p2-11e-t1007-attack]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreachScope analysis branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Checkout pinned Atomic EVTX source
        run: |
          git clone --filter=blob:none https://github.com/arniki/atomic-evtx.git atomic-evtx
          git -C atomic-evtx checkout --detach 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C atomic-evtx rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"
          test -d atomic-evtx/ttp_evtx/T1007-1
          test -d atomic-evtx/ttp_evtx/T1007-2

      - name: Probe exact T1007 attack command forms
        run: |
          python scripts/p2_11e_t1007_attack_probe.py atomic-evtx --out out/p2_11e_t1007_attack_probe.json
          sha256sum out/p2_11e_t1007_attack_probe.json

      - name: Upload probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11e-t1007-attack-probe
          path: out/p2_11e_t1007_attack_probe.json
          if-no-files-found: error
          retention-days: 30
