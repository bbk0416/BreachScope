name: P2-11D Atomic EVTX External Calibration

on:
  push:
    branches: [measure/p2-11d-atomic-calibration]

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout calibration control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          fetch-depth: 0

      - name: Checkout exact P2-11D detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 456b2a8238837026c8249ae1020b16249715bc04
          path: detector
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt

      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector
          python detector/scripts/verify_dependency_locks.py --strict

      - name: Clone exact external source
        run: |
          git clone --no-checkout https://github.com/arniki/atomic-evtx.git "$RUNNER_TEMP/atomic-evtx"
          git -C "$RUNNER_TEMP/atomic-evtx" checkout --detach 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C "$RUNNER_TEMP/atomic-evtx" rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"

      - name: Execute fixed 12-scenario external calibration
        run: |
          python control/scripts/p2_11d_score_atomic_calibration.py \
            --control-root "$GITHUB_WORKSPACE/control" \
            --detector-root "$GITHUB_WORKSPACE/detector" \
            --source-root "$RUNNER_TEMP/atomic-evtx" \
            --out-root "$RUNNER_TEMP/p2-11d-calibration"

      - name: Upload calibration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11d-atomic-evtx-external-calibration
          path: |
            ${{ runner.temp }}/p2-11d-calibration/aggregate-result.json
            ${{ runner.temp }}/p2-11d-calibration/rules-freeze.json
            ${{ runner.temp }}/p2-11d-calibration/scenarios/*/manifest.yaml
            ${{ runner.temp }}/p2-11d-calibration/scenarios/*/labels.jsonl
            ${{ runner.temp }}/p2-11d-calibration/scenarios/*/result.json
          if-no-files-found: error
