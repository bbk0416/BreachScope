name: Docker Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: breachscope:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}

      - name: Container smoke test
        run: |
          docker run -d --name breachscope-ci -p 8000:8000 \
            -e BS_API_KEY=ci-key \
            -e BS_ADMIN_PASSWORD=ci-password \
            -e BS_SESSION_SECRET=ci-session-secret-please-change \
            breachscope:ci

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health/live; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/api/health/ready
          curl -fsS -H 'X-API-Key: ci-key' http://127.0.0.1:8000/api/info
          curl -fsS -H 'X-API-Key: ci-key' http://127.0.0.1:8000/api/ops/release-info
          docker logs breachscope-ci --tail 50
