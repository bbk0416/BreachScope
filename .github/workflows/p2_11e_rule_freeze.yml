name: P2-11E Rule Freeze Probe

on:
  push:
    branches: [measure/p2-11e-t1007-calibration]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
      - name: Checkout exact detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: aa08c6beca2720a69165aed37562ba9730a8a62f
          path: detector
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt
      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector
      - name: Run focused tests and freeze
        run: |
          cd detector
          python -m pytest -q tests/test_p2_11e_service_discovery_rules.py
          python scripts/validate_rulepack.py rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "$RUNNER_TEMP/p2-11e-rules-freeze.json"
          cat "$RUNNER_TEMP/p2-11e-rules-freeze.json"
      - name: Upload freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11e-rules-freeze
          path: ${{ runner.temp }}/p2-11e-rules-freeze.json
          if-no-files-found: error
