name: P2-10G Evidence Builder

on:
  push:
    branches:
      - measure/p2-10g-evidence-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fix/p2-10g-hidden-run-key
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact locked environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Load and run evidence patch helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin measure/p2-10g-evidence-builder
          git show origin/measure/p2-10g-evidence-builder:tools/p2_10g_evidence_builder.py > /tmp/p2_10g_evidence_builder.py
          python /tmp/p2_10g_evidence_builder.py

      - name: Validate patched evidence before push
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q breachscope api scripts tests
          pytest -q tests/test_p2_10_hidden_run_key_rule.py tests/test_reproducible_benchmark.py
          python scripts/verify_current_detection_evidence.py
          git diff --check

      - name: Commit and push evidence to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P2_10G_HIDDEN_RUN_KEY_REMEDIATION.md \
                  external_baseline/current_detection_evidence.yaml \
                  external_baseline/results/p2_10g_ab76f3a3/measurement.yaml \
                  scripts/verify_current_detection_evidence.py \
                  tests/test_reproducible_benchmark.py
          git diff --cached --check
          git commit -m "docs: record P2-10G detection evidence"
          git push origin HEAD:fix/p2-10g-hidden-run-key
