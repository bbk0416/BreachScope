name: P2-11I T1021.001-1 Event Shape
on:
  push:
    branches:
      - analysis/p2-11i-t1021-001-event-shape
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements-lock-py311.txt
      - name: Install exact environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Clone exact Atomic EVTX source
        run: |
          git clone --no-checkout https://github.com/arniki/atomic-evtx.git "$RUNNER_TEMP/atomic-evtx"
          git -C "$RUNNER_TEMP/atomic-evtx" checkout --detach 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C "$RUNNER_TEMP/atomic-evtx" rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"
      - name: Inspect exact Sysmon process events
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from scripts.evaluate_external_holdout import _convert_one_evtx, event_identity_payload

          p = Path(os.environ['RUNNER_TEMP']) / 'atomic-evtx' / 'ttp_evtx' / 'T1021.001-1' / 'T1021.001-1_Microsoft-Windows-Sysmon_Operational.evtx'
          rows = _convert_one_evtx(p)
          print('TOTAL_SYSMON_ROWS=' + str(len(rows)))
          selected = []
          for idx, raw in enumerate(rows, 1):
              ident = event_identity_payload(raw)
              if str(ident.get('event_id')) != '1':
                  continue
              raw_map = raw.get('raw') if isinstance(raw, dict) else None
              if not isinstance(raw_map, dict):
                  raw_map = raw if isinstance(raw, dict) else {}
              canonical = raw_map.get('canonical') if isinstance(raw_map.get('canonical'), dict) else {}
              def first(*keys):
                  for src in (raw, raw_map, canonical):
                      if isinstance(src, dict):
                          for k in keys:
                              v = src.get(k)
                              if v not in (None, ''):
                                  return str(v)
                  return ''
              image = first('Image','image','ProcessName','process_name')
              cmd = ident.get('command_line','') or first('CommandLine','command_line','ProcessCommandLine')
              parent = first('ParentImage','parent_image')
              token = (image + ' ' + cmd + ' ' + parent).lower()
              if any(x in token for x in ('mstsc', 'cmdkey', 'termsrv', '/v:', '/v :', 'remote desktop')):
                  selected.append({'record_index':idx,'event_id':ident.get('event_id'),'image':image,'command_line':cmd,'parent_image':parent,'source':ident.get('source'),'host':ident.get('host'),'user':ident.get('user')})
          print('SELECTED_COUNT=' + str(len(selected)))
          for row in selected:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('P2_11I_T1021_001_EVENT_SHAPE=PASS')
          PY
