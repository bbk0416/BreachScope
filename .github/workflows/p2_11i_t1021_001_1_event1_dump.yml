name: P2-11I T1021.001-1 Event1 Dump

on:
  push:
    branches:
      - analysis/p2-11i-t1021-001-raw-event1

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements-lock-py311.txt

      - name: Install EVTX parser
        run: python -m pip install python-evtx==0.8.1

      - name: Clone exact external source
        run: |
          git clone --no-checkout https://github.com/arniki/atomic-evtx.git "$RUNNER_TEMP/atomic-evtx"
          git -C "$RUNNER_TEMP/atomic-evtx" checkout --detach 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C "$RUNNER_TEMP/atomic-evtx" rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"

      - name: Dump all Sysmon Event ID 1 records
        run: |
          python scripts/p2_11i_dump_t1021_001_1_event1.py \
            "$RUNNER_TEMP/atomic-evtx/ttp_evtx/T1021.001-1/T1021.001-1_Microsoft-Windows-Sysmon_Operational.evtx" \
            --out "$RUNNER_TEMP/p2_11i_t1021_001_1_event1_dump.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'p2_11i_t1021_001_1_event1_dump.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(d, indent=2, ensure_ascii=False))
          PY

      - name: Upload Event1 dump
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-11i-t1021-001-1-event1-dump
          path: ${{ runner.temp }}/p2_11i_t1021_001_1_event1_dump.json
          if-no-files-found: error
          retention-days: 30
