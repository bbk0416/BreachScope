name: P2-10A Scheduled Task Measurement

on:
  push:
    branches: ["measure/p2-10a-scheduled-task-4698"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Focused rule tests
        run: python -m pytest -q tests/test_p2_10_scheduled_task_event_rule.py

      - name: Run pinned external attack baseline
        run: python scripts/run_external_baseline.py --out out/p2_10a_attack --timeout 120

      - name: Assert attack-side improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/p2_10a_attack/summary.json").read_text(encoding="utf-8"))
          metrics = summary["primary_metrics"]
          outcomes = {row["scenario_id"]: row for row in summary["scenarios"]}
          assert metrics["scenario_hits"] == 3, metrics
          assert metrics["scenario_misses"] == 7, metrics
          assert metrics["scenario_total"] == 10, metrics
          scheduled = outcomes["exec-scheduled-task"]
          assert scheduled["status"] == "hit", scheduled
          assert "T1053.005" in scheduled["matched_techniques"], scheduled
          print("P2-10A attack delta: PASS 2/10 -> 3/10")
          print("rules_tree_sha256=" + summary["rules_tree_sha256"])
          print("findings=" + str(summary["detection_observation"]["findings"]))
          PY

      - name: Prove zero incremental matches on pinned benign corpus
        run: |
          python - <<'PY'
          import hashlib
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          import yaml
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          recipe = yaml.safe_load(Path("external_baseline/p2_09d_benign_sources.yaml").read_text(encoding="utf-8"))
          source = recipe["source"]
          work = Path(tempfile.mkdtemp(prefix="p2-10a-benign-proof-"))
          archive = work / source["asset_name"]
          req = urllib.request.Request(source["asset_url"], headers={"User-Agent": "BreachScope-P2-10A/1.0"})
          with urllib.request.urlopen(req, timeout=300) as response, archive.open("wb") as out:
              shutil.copyfileobj(response, out, length=1024 * 1024)

          assert archive.stat().st_size == int(source["size"])
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == source["sha256"]

          sysmon_name = "Logs_Client/Microsoft-Windows-Sysmon%4Operational.evtx"
          temp_evtx = work / "current.evtx"
          source_files = 0
          events = 0
          matches = 0

          with tarfile.open(archive, "r:gz") as tf:
              members = [
                  m for m in tf.getmembers()
                  if m.isfile() and m.name.casefold().endswith(".evtx") and m.name != sysmon_name
              ]
              assert len(members) == 351
              for member in members:
                  src = tf.extractfile(member)
                  assert src is not None
                  with src, temp_evtx.open("wb") as out:
                      shutil.copyfileobj(src, out, length=1024 * 1024)
                  source_files += 1
                  with Evtx(str(temp_evtx)) as log:
                      for record in log.records():
                          row = _extract_from_xml(record.xml())
                          if not row:
                              continue
                          events += 1
                          if (
                              str(row.get("source") or "") == "Microsoft-Windows-Security-Auditing"
                              and str(row.get("event_id") or "") == "4698"
                          ):
                              matches += 1

          assert source_files == 351, source_files
          assert events == 34423, events
          assert matches == 0, matches
          print(f"P2-10A benign predicate proof: PASS files={source_files} events={events} matches={matches}")
          print("Sysmon exclusion is exact because the new rule additionally requires source=Microsoft-Windows-Security-Auditing.")
          PY

      - name: Write measurement record
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml

          summary = json.loads(Path("out/p2_10a_attack/summary.json").read_text(encoding="utf-8"))
          payload = {
              "schema": "breachscope.p2_10a_measurement.v1",
              "evaluated_repo_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "rules_tree_sha256": summary["rules_tree_sha256"],
              "change": {
                  "rule_id": "R-SCHTASK-4698",
                  "predicate": {
                      "source_equals": "Microsoft-Windows-Security-Auditing",
                      "event_id_equals": "4698",
                  },
                  "mitre_technique": "T1053.005",
              },
              "attack_external_baseline": {
                  "baseline_id": summary["baseline_id"],
                  "scenario_hits": summary["primary_metrics"]["scenario_hits"],
                  "scenario_misses": summary["primary_metrics"]["scenario_misses"],
                  "scenario_total": summary["primary_metrics"]["scenario_total"],
                  "findings": summary["detection_observation"]["findings"],
                  "scheduled_task_status": next(row["status"] for row in summary["scenarios"] if row["scenario_id"] == "exec-scheduled-task"),
              },
              "benign_incremental_match_proof": {
                  "baseline_id": "p2-09d-nextron-win10-v1",
                  "corpus_sha256": "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e",
                  "non_sysmon_source_files_scanned": 351,
                  "non_sysmon_events_scanned": 34423,
                  "predicate_matches": 0,
                  "sysmon_cannot_match_provider_predicate": True,
                  "fresh_full_fp_tn_rerun": False,
              },
              "claim_boundary": {
                  "production_detection_rate": "NOT_CLAIMED",
                  "production_false_positive_rate": "NOT_CLAIMED",
                  "fresh_full_benign_fpr_for_new_rulepack": "NOT_CLAIMED",
              },
          }
          Path("out/p2_10a_measurement.yaml").write_text(
              yaml.safe_dump(payload, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY

      - name: Upload measurement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10a-scheduled-task-measurement
          path: |
            out/p2_10a_attack/rules_freeze.json
            out/p2_10a_attack/manifest.yaml
            out/p2_10a_attack/result.json
            out/p2_10a_attack/summary.json
            out/p2_10a_attack/SUMMARY.md
            out/p2_10a_measurement.yaml
          if-no-files-found: error
