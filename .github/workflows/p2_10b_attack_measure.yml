name: P2-10B WMI Remote XSL Attack Measurement

on:
  push:
    branches:
      - measure/p2-10b-wmi-xsl
    paths:
      - .github/workflows/p2_10b_attack_measure.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict
      - name: Run pinned external attack baseline
        run: |
          python scripts/run_external_baseline.py --out out/p2_10b_attack --timeout 120
      - name: Assert narrowed P2-10B expected improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/p2_10b_attack')
          result = json.loads((p / 'result.json').read_text(encoding='utf-8'))
          freeze = json.loads((p / 'rules_freeze.json').read_text(encoding='utf-8'))
          outcomes = {row['scenario_id']: row for row in result['scenarios']['outcomes']}
          assert result['corpus']['events'] == 202, result['corpus']
          assert result['corpus']['source_files'] == 10, result['corpus']
          assert result['detection']['rules'] == 54, result['detection']
          assert result['scenarios']['total'] == 10, result['scenarios']
          assert result['scenarios']['hits'] == 4, result['scenarios']
          assert result['scenarios']['misses'] == 6, result['scenarios']
          row = outcomes['exec-wmi-xsl']
          assert row['status'] == 'hit', row
          assert 'T1047' in row['matched_techniques'], row
          print('P2_10B_ATTACK_RESULT=' + json.dumps({
              'rules_tree_sha256': freeze['rules_tree_sha256'],
              'rules': result['detection']['rules'],
              'findings': result['detection']['findings'],
              'flagged_events': result['detection']['flagged_events'],
              'scenario_hits': result['scenarios']['hits'],
              'scenario_misses': result['scenarios']['misses'],
              'scenario_total': result['scenarios']['total'],
              'exec_wmi_xsl': row,
          }, sort_keys=True))
          PY
