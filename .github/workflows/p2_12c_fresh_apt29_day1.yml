name: P2-12C Fresh APT29 Day 1 Scoring

on:
  push:
    branches: [measure/p2-12c-apt29-day1-fresh-scoring]

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout measurement control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
      - name: Checkout exact frozen detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13eb8f6ac93cf29817ca3ed885e8dc18b8fbb2fb
          path: detector
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt
      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector
      - name: Verify frozen binding before scoring
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('control/external_baseline/p2_12b_apt29_day1_binding.yaml')
          d = yaml.safe_load(p.read_text(encoding='utf-8'))
          assert d['frozen_detector']['repo_commit'] == '13eb8f6ac93cf29817ca3ed885e8dc18b8fbb2fb'
          assert d['frozen_detector']['rules_tree_sha256'] == '9f823a189530528a47b11c5519b02dc9b97473b8c0f6a8e0c13e1ed8d04b5e92'
          assert d['label_binding']['unique_technique_count'] == 45
          assert d['protocol_state']['detector_executed_on_selected_archive'] is False
          print('P2_12C_PRE_SCORE_BINDING=PASS')
          PY
      - name: Download exact selected archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          url = 'https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/compound/apt29/day1/apt29_evals_day1_manual.zip'
          p = Path('${{ runner.temp }}') / 'apt29_evals_day1_manual.zip'
          urllib.request.urlretrieve(url, p)
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          assert p.stat().st_size == 13944973, p.stat().st_size
          assert h == '98a073140860560d70080ace9142961be4f64b4862bae892d62d0f254d0fdbe5', h
          print('P2_12C_ARCHIVE_BYTE_BINDING=PASS')
          PY
      - name: Freeze exact detector at runtime
        run: |
          cd detector
          python scripts/run.py --validate-rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "${{ runner.temp }}/p2-12c-rules-freeze.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('${{ runner.temp }}') / 'p2-12c-rules-freeze.json'
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['repo_commit'] == '13eb8f6ac93cf29817ca3ed885e8dc18b8fbb2fb'
          assert d['rules_tree_sha256'] == '9f823a189530528a47b11c5519b02dc9b97473b8c0f6a8e0c13e1ed8d04b5e92'
          assert int(d['rule_file_count']) == 4
          print('P2_12C_RUNTIME_FREEZE=PASS')
          PY
      - name: Score fresh Day 1 corpus once
        run: |
          python control/scripts/p2_12c_score_apt29_day1.py \
            --detector detector \
            --archive "${{ runner.temp }}/apt29_evals_day1_manual.zip" \
            --binding control/external_baseline/p2_12b_apt29_day1_binding.yaml \
            --freeze "${{ runner.temp }}/p2-12c-rules-freeze.json" \
            --out "${{ runner.temp }}/p2-12c-apt29-day1-result.json"
      - name: Upload immutable scoring evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-12c-fresh-apt29-day1
          path: |
            ${{ runner.temp }}/p2-12c-apt29-day1-result.json
            ${{ runner.temp }}/p2-12c-rules-freeze.json
          if-no-files-found: error
          retention-days: 90
