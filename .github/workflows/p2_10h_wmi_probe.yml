name: P2-10H WMI Probe

on:
  push:
    branches:
      - measure/p2-10h-wmi-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Materialize pinned lm-wmi sample
        run: python scripts/run_external_baseline.py --asset evtx-lm-wmi --out out/p2_10h_wmi_probe --timeout 120

      - name: Dump normalized and raw 4624/4688 fields
        run: python scripts/p2_10h_probe_wmi.py
