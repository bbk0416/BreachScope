name: P2-11A Post-Remediation Freeze

on:
  push:
    branches: [measure/p2-11a-post-remediation-freeze]

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 674615ef3c92d5b4bbc4dec71f566d49de0454f4
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact locked environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Verify current evidence chain
        run: |
          python scripts/verify_current_detection_evidence.py --json > "$RUNNER_TEMP/current-detection-evidence.json"

      - name: Freeze exact repository and rules
        run: |
          python scripts/evaluate_external_holdout.py freeze \
            --repo . \
            --rules-dir rules \
            --out "$RUNNER_TEMP/p2-11a-rules-freeze.json"

      - name: Record exact source hashes
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/p2-11a-source-hashes.json"
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def git_blob_sha1(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}".encode("ascii") + b"\0" + data).hexdigest()

          payload = {
              "repo_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "working_tree_clean": subprocess.call(["git", "diff", "--quiet"]) == 0 and subprocess.call(["git", "diff", "--cached", "--quiet"]) == 0,
              "analyzer_git_blob_sha1": git_blob_sha1(Path("breachscope/analyzer.py")),
              "p2_10_rule_file_git_blob_sha1": git_blob_sha1(Path("rules/p2_10_event_rules.yml")),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload freeze evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11a-post-remediation-freeze
          path: |
            ${{ runner.temp }}/p2-11a-rules-freeze.json
            ${{ runner.temp }}/p2-11a-source-hashes.json
            ${{ runner.temp }}/current-detection-evidence.json
          if-no-files-found: error
