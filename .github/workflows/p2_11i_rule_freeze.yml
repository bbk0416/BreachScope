name: P2-11I Rule Freeze Probe

on:
  push:
    branches: [measure/p2-11i-t1021-001-calibration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control

      - name: Checkout exact detector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fe80737a52e8177674ade8a402e5bb2a7e9a277b
          path: detector

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: detector/requirements-lock-py311.txt

      - name: Install exact detector environment
        run: |
          python -m pip install --require-hashes -r detector/requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e detector

      - name: Run focused tests and freeze
        run: |
          cd detector
          python -m pytest -q tests/test_p2_11i_rdp_client_rule.py
          python scripts/run.py --validate-rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "$RUNNER_TEMP/p2-11i-rules-freeze.json"
          cat "$RUNNER_TEMP/p2-11i-rules-freeze.json"

      - name: Verify exact P2-11I detector freeze
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "p2-11i-rules-freeze.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["repo_commit"] == "fe80737a52e8177674ade8a402e5bb2a7e9a277b"
          assert data["rules_tree_sha256"] == "7e87c18125565dc54af150dfd73b5356aef68b9dc0fbc0e94d0b8a534c73df8d"
          assert int(data["rule_file_count"]) == 4
          print("P2_11I_RULE_FREEZE=PASS")
          PY

      - name: Upload freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-11i-rules-freeze
          path: ${{ runner.temp }}/p2-11i-rules-freeze.json
          if-no-files-found: error
          retention-days: 30
