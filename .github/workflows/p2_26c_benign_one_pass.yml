name: P2-26C Benign One-Pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p2_26c_benign_one_pass.yml"

permissions:
  contents: read
  actions: read

jobs:
  canonical-measurement:
    name: P2-26C canonical benign measurement
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout merged contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.16
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Materialize frozen product worktree
        run: |
          git worktree add --detach "$RUNNER_TEMP/p2_26c_product" b70ab6bbc519ac137dae324ad860391371f470db
          test "$(git -C "$RUNNER_TEMP/p2_26c_product" rev-parse HEAD)" = "b70ab6bbc519ac137dae324ad860391371f470db"
          test -z "$(git -C "$RUNNER_TEMP/p2_26c_product" status --porcelain -uall)"

      - name: Download canonical Phase-B source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: p2-26c-benign-source-35492508210
          path: ${{ runner.temp }}/p2_26c_source
          github-token: ${{ github.token }}
          repository: bbk0416/BreachScope
          run-id: 35492508210

      - name: Preflight frozen product and runner
        run: |
          python scripts/p2_26c_gha_windows_benign_one_pass.py \
            --product-repo "$RUNNER_TEMP/p2_26c_product" \
            --contract external_baseline/p2_26c_gha_windows_benign_one_pass_contract.yaml \
            --preflight

      - name: Run first and only canonical measurement
        run: |
          mkdir -p "$RUNNER_TEMP/p2_26c_result"
          python scripts/p2_26c_gha_windows_benign_one_pass.py \
            --product-repo "$RUNNER_TEMP/p2_26c_product" \
            --contract external_baseline/p2_26c_gha_windows_benign_one_pass_contract.yaml \
            --data-dir "$RUNNER_TEMP/p2_26c_source" \
            --out "$RUNNER_TEMP/p2_26c_result/result.json" \
            --lock "$RUNNER_TEMP/p2_26c_result/P2_26C_ONE_PASS.lock"

      - name: Upload canonical result and permanent lock
        if: ${{ always() && github.run_attempt == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-26c-benign-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p2_26c_result/result.json
            ${{ runner.temp }}/p2_26c_result/P2_26C_ONE_PASS.lock
          if-no-files-found: error
          retention-days: 90
