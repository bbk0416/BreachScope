name: P2-11C Atomic-EVTX Miss Probe

on:
  push:
    branches:
      - analysis/p2-11c-atomic-miss-taxonomy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'

      - name: Install parser dependencies
        run: python -m pip install python-evtx==0.8.1 PyYAML==6.0.3

      - name: Clone pinned Atomic-EVTX source
        run: |
          git clone --quiet https://github.com/arniki/atomic-evtx.git atomic-evtx
          git -C atomic-evtx checkout --quiet 8de5fa8f158b4d72d1e3c6f07053162c90ee6238
          test "$(git -C atomic-evtx rev-parse HEAD)" = "8de5fa8f158b4d72d1e3c6f07053162c90ee6238"

      - name: Extract miss-analysis evidence
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/p2_11c_atomic_miss_probe.py --atomic-root atomic-evtx --out out/p2_11c_probe
          cat out/p2_11c_probe/summary.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2-11c-atomic-miss-probe
          path: out/p2_11c_probe/
          if-no-files-found: error
          retention-days: 90
