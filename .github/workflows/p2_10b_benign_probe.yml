name: P2-10B WMI XSL Benign Probe

on:
  push:
    branches:
      - measure/p2-10b-wmi-xsl

permissions:
  contents: read

jobs:
  probe-benign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Scan pinned benign Sysmon for candidate predicate
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u - <<'PY'
          import hashlib
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from pathlib import Path

          import yaml
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          recipe = yaml.safe_load(Path("external_baseline/p2_09d_benign_sources.yaml").read_text(encoding="utf-8"))
          source = recipe["source"]
          work = Path(tempfile.mkdtemp(prefix="p2-10b-benign-"))
          archive = work / source["asset_name"]
          request = urllib.request.Request(source["asset_url"], headers={"User-Agent": "BreachScope-P2-10B/1.0"})
          with urllib.request.urlopen(request, timeout=300) as response, archive.open("wb") as out:
              shutil.copyfileobj(response, out, length=1024 * 1024)

          size = archive.stat().st_size
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert size == int(source["size"]), (size, source["size"])
          assert digest == source["sha256"], (digest, source["sha256"])
          print(f"archive_verified size={size} sha256={digest}", flush=True)

          sysmon_name = "Logs_Client/Microsoft-Windows-Sysmon%4Operational.evtx"
          target = work / "sysmon.evtx"
          with tarfile.open(archive, "r:gz") as tf:
              member = tf.getmember(sysmon_name)
              src = tf.extractfile(member)
              assert src is not None
              with src, target.open("wb") as out:
                  shutil.copyfileobj(src, out, length=1024 * 1024)
          print(f"sysmon_extracted bytes={target.stat().st_size}", flush=True)

          total = 0
          event1 = 0
          event1_wmic = 0
          event1_wmic_format = 0
          candidate = 0
          examples = []
          with Evtx(str(target)) as log:
              for record in log.records():
                  total += 1
                  xml = record.xml()
                  lowered_xml = xml.casefold()
                  if "wmic" not in lowered_xml:
                      if total % 100000 == 0:
                          print(f"progress records={total} event1={event1} candidate={candidate}", flush=True)
                      # Event 1 count is informational; avoid full parsing for unrelated records.
                      continue
                  row = _extract_from_xml(xml)
                  if not row:
                      continue
                  if str(row.get("event_id") or "") != "1":
                      continue
                  event1 += 1
                  command = str(row.get("command_line") or "")
                  lowered = command.casefold()
                  if "wmic" in lowered:
                      event1_wmic += 1
                      if "/format:" in lowered:
                          event1_wmic_format += 1
                      if "/format:\"http" in lowered:
                          candidate += 1
                          if len(examples) < 5:
                              examples.append(command)
                  if total % 100000 == 0:
                      print(f"progress records={total} event1_wmic={event1_wmic} candidate={candidate}", flush=True)

          print(f"sysmon_records={total}", flush=True)
          print(f"event1_wmic={event1_wmic}", flush=True)
          print(f"event1_wmic_format={event1_wmic_format}", flush=True)
          print(f"candidate_wmic_format_http={candidate}", flush=True)
          for item in examples:
              print("candidate_example=" + item, flush=True)
          assert total == 732200, total
          assert candidate == 0, candidate
          print("P2-10B benign candidate predicate: PASS candidate=0", flush=True)
          PY
