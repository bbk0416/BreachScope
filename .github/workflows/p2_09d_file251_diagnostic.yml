name: P2-09D EVTX Chunk Parallel Diagnostic

on:
  push:
    branches:
      - measure/p2-09d-file251-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact measured main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 789c1f45b35599adbb5816c69c2e1e5c586584c9
          fetch-depth: 1

      - name: Set up Python 3.11.16
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16

      - name: Install exact locked product environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-lock-py311.txt

      - name: Download and verify pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error \
            -o /tmp/win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  /tmp/win10-client.tgz" | sha256sum -c -
          rm -rf /tmp/p2-09d-corpus
          mkdir -p /tmp/p2-09d-corpus
          tar -xzf /tmp/win10-client.tgz -C /tmp/p2-09d-corpus

      - name: Write chunk-parallel diagnostic helper
        shell: bash
        run: |
          cat > /tmp/parallel_evtx_diag.py <<'PY'
          from __future__ import annotations

          import argparse
          import hashlib
          import itertools
          import json
          import multiprocessing
          import shutil
          import time
          from concurrent.futures import ProcessPoolExecutor, as_completed
          from pathlib import Path

          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml


          def canonical_bytes(row: dict) -> bytes:
              return (
                  json.dumps(
                      row,
                      sort_keys=True,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")
                  + b"\n"
              )


          def count_chunks(path: str) -> int:
              with Evtx(path) as log:
                  return sum(1 for _ in log.chunks())


          def split_ranges(total: int, workers: int) -> list[tuple[int, int]]:
              workers = max(1, min(workers, total))
              base, remainder = divmod(total, workers)
              ranges = []
              start = 0
              for index in range(workers):
                  width = base + (1 if index < remainder else 0)
                  end = start + width
                  ranges.append((start, end))
                  start = end
              assert start == total
              return ranges


          def render_range(
              path: str,
              start: int,
              end: int,
              part_path: str,
          ) -> tuple[int, int, int, float]:
              begun = time.perf_counter()
              count = 0
              output = Path(part_path)
              output.parent.mkdir(parents=True, exist_ok=True)
              with Evtx(path) as log, output.open("w", encoding="utf-8", newline="\n") as target:
                  for chunk in itertools.islice(log.chunks(), start, end):
                      for record in chunk.records():
                          row = _extract_from_xml(record.xml())
                          if not row:
                              continue
                          target.write(json.dumps(row, ensure_ascii=False) + "\n")
                          count += 1
              return start, end, count, time.perf_counter() - begun


          def digest_jsonl(path: Path) -> tuple[int, str]:
              digest = hashlib.sha256()
              count = 0
              with path.open("r", encoding="utf-8") as source:
                  for line in source:
                      if not line.strip():
                          continue
                      row = json.loads(line)
                      digest.update(canonical_bytes(row))
                      count += 1
              return count, digest.hexdigest()


          def run_parallel(path: Path, output: Path, workers: int) -> tuple[int, str, float, int]:
              begun = time.perf_counter()
              total_chunks = count_chunks(str(path))
              ranges = split_ranges(total_chunks, workers)
              part_root = output.with_suffix(output.suffix + ".parts")
              shutil.rmtree(part_root, ignore_errors=True)
              part_root.mkdir(parents=True, exist_ok=True)

              context = multiprocessing.get_context("fork")
              futures = []
              with ProcessPoolExecutor(max_workers=len(ranges), mp_context=context) as pool:
                  for ordinal, (start, end) in enumerate(ranges):
                      part = part_root / f"part-{ordinal:03d}.jsonl"
                      futures.append(
                          pool.submit(render_range, str(path), start, end, str(part))
                      )
                  completed = []
                  for future in as_completed(futures):
                      row = future.result()
                      completed.append(row)
                      print(
                          f"RANGE_COMPLETE chunks={row[0]}:{row[1]} events={row[2]} seconds={row[3]:.3f}",
                          flush=True,
                      )

              output.parent.mkdir(parents=True, exist_ok=True)
              with output.open("wb") as target:
                  for ordinal in range(len(ranges)):
                      part = part_root / f"part-{ordinal:03d}.jsonl"
                      with part.open("rb") as source:
                          shutil.copyfileobj(source, target, length=1024 * 1024)

              count, digest = digest_jsonl(output)
              elapsed = time.perf_counter() - begun
              shutil.rmtree(part_root, ignore_errors=True)
              return count, digest, elapsed, total_chunks


          def run_sequential(path: Path) -> tuple[int, str, float]:
              begun = time.perf_counter()
              digest = hashlib.sha256()
              count = 0
              with Evtx(str(path)) as log:
                  for record in log.records():
                      row = _extract_from_xml(record.xml())
                      if not row:
                          continue
                      digest.update(canonical_bytes(row))
                      count += 1
              return count, digest.hexdigest(), time.perf_counter() - begun


          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("path", type=Path)
              ap.add_argument("--workers", type=int, default=8)
              ap.add_argument("--out", type=Path, required=True)
              ap.add_argument("--compare-sequential", action="store_true")
              args = ap.parse_args()

              if args.compare_sequential:
                  seq_count, seq_hash, seq_seconds = run_sequential(args.path)
                  print(
                      f"SEQUENTIAL count={seq_count} sha256={seq_hash} seconds={seq_seconds:.3f}",
                      flush=True,
                  )
              else:
                  seq_count = None
                  seq_hash = None

              par_count, par_hash, par_seconds, chunks = run_parallel(
                  args.path, args.out, args.workers
              )
              print(
                  f"PARALLEL chunks={chunks} workers={args.workers} count={par_count} "
                  f"sha256={par_hash} seconds={par_seconds:.3f} bytes={args.out.stat().st_size}",
                  flush=True,
              )
              if args.compare_sequential:
                  print(f"COUNT_MATCH={seq_count == par_count}", flush=True)
                  print(f"NORMALIZED_HASH_MATCH={seq_hash == par_hash}", flush=True)
                  if seq_count != par_count or seq_hash != par_hash:
                      return 3
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Prove semantic equivalence on index 249
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from pathlib import Path
          root = Path('/tmp/p2-09d-corpus')
          rows = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.name.casefold().endswith('.evtx')
          )
          path = rows[248]
          Path('/tmp/index249_path.txt').write_text(str(path), encoding='utf-8')
          print(f'INDEX249={path.relative_to(root).as_posix()} size={path.stat().st_size}')
          PY
          python -u /tmp/parallel_evtx_diag.py \
            "$(cat /tmp/index249_path.txt)" \
            --workers 4 \
            --out /tmp/index249-parallel.jsonl \
            --compare-sequential

      - name: Parse full 799 MB Sysmon with same python-evtx semantics in parallel
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from pathlib import Path
          root = Path('/tmp/p2-09d-corpus')
          rows = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.name.casefold().endswith('.evtx')
          )
          path = rows[272]
          Path('/tmp/sysmon_path.txt').write_text(str(path), encoding='utf-8')
          print(f'SYSMON={path.relative_to(root).as_posix()} size={path.stat().st_size}')
          PY
          python -u /tmp/parallel_evtx_diag.py \
            "$(cat /tmp/sysmon_path.txt)" \
            --workers 8 \
            --out /tmp/sysmon-parallel.jsonl
          ls -lh /tmp/sysmon-parallel.jsonl
