name: P2-09D EVTX Backend Diagnostic

on:
  push:
    branches:
      - measure/p2-09d-file251-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact measured main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 789c1f45b35599adbb5816c69c2e1e5c586584c9
          fetch-depth: 1

      - name: Set up Python 3.11.16
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16

      - name: Install locked product environment and Rust parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --disable-pip-version-check evtx==0.12.1

      - name: Download and verify pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error \
            -o /tmp/win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  /tmp/win10-client.tgz" | sha256sum -c -
          rm -rf /tmp/p2-09d-corpus
          mkdir -p /tmp/p2-09d-corpus
          tar -xzf /tmp/win10-client.tgz -C /tmp/p2-09d-corpus

      - name: Compare normalized output on index 249
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import time

          from Evtx.Evtx import Evtx
          from evtx import PyEvtxParser
          from breachscope.ingest import _extract_from_xml

          root = Path('/tmp/p2-09d-corpus')
          rows = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.name.casefold().endswith('.evtx')
          )
          path = rows[248]
          print(f'COMPARE path={path.relative_to(root).as_posix()} size={path.stat().st_size}')

          def add_row(digest, row):
              payload = json.dumps(
                  row,
                  sort_keys=True,
                  ensure_ascii=False,
                  separators=(',', ':'),
              ).encode('utf-8')
              digest.update(payload)
              digest.update(b'\n')

          start = time.perf_counter()
          legacy_digest = hashlib.sha256()
          legacy_count = 0
          with Evtx(str(path)) as log:
              for record in log.records():
                  row = _extract_from_xml(record.xml())
                  if row:
                      add_row(legacy_digest, row)
                      legacy_count += 1
          legacy_seconds = time.perf_counter() - start
          print(
              f'LEGACY count={legacy_count} sha256={legacy_digest.hexdigest()} '
              f'seconds={legacy_seconds:.3f}'
          )

          start = time.perf_counter()
          rust_digest = hashlib.sha256()
          rust_count = 0
          parser = PyEvtxParser(str(path), number_of_threads=1)
          for record in parser.records():
              row = _extract_from_xml(record['data'])
              if row:
                  add_row(rust_digest, row)
                  rust_count += 1
          rust_seconds = time.perf_counter() - start
          print(
              f'RUST count={rust_count} sha256={rust_digest.hexdigest()} '
              f'seconds={rust_seconds:.3f}'
          )
          print(f'COUNT_MATCH={legacy_count == rust_count}')
          print(f'NORMALIZED_HASH_MATCH={legacy_digest.hexdigest() == rust_digest.hexdigest()}')
          PY

      - name: Parse and normalize full 799 MB Sysmon EVTX with Rust backend
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import time

          from evtx import PyEvtxParser
          from breachscope.ingest import _extract_from_xml

          root = Path('/tmp/p2-09d-corpus')
          rows = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.name.casefold().endswith('.evtx')
          )
          path = rows[272]
          rel = path.relative_to(root).as_posix()
          print(f'SYSMON path={rel} size={path.stat().st_size}', flush=True)

          digest = hashlib.sha256()
          count = 0
          normalized = 0
          start = time.perf_counter()
          parser = PyEvtxParser(str(path), number_of_threads=0)
          for record in parser.records():
              count += 1
              row = _extract_from_xml(record['data'])
              if row:
                  payload = json.dumps(
                      row,
                      sort_keys=True,
                      ensure_ascii=False,
                      separators=(',', ':'),
                  ).encode('utf-8')
                  digest.update(payload)
                  digest.update(b'\n')
                  normalized += 1
              if count % 100000 == 0:
                  print(
                      f'PROGRESS records={count} normalized={normalized} '
                      f'seconds={time.perf_counter()-start:.1f}',
                      flush=True,
                  )

          elapsed = time.perf_counter() - start
          print(
              f'SYSMON_COMPLETE records={count} normalized={normalized} '
              f'sha256={digest.hexdigest()} seconds={elapsed:.3f}',
              flush=True,
          )
          PY
