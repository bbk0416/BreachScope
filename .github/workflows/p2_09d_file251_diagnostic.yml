name: P2-09D File 251 Diagnostic

on:
  push:
    branches:
      - measure/p2-09d-file251-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download and verify pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error \
            -o /tmp/win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  /tmp/win10-client.tgz" | sha256sum -c -

      - name: Extract pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-09d-corpus
          mkdir -p /tmp/p2-09d-corpus
          tar -xzf /tmp/win10-client.tgz -C /tmp/p2-09d-corpus

      - name: Install exact EVTX parser
        shell: bash
        run: python -m pip install --disable-pip-version-check python-evtx==0.8.1

      - name: Parse EVTX indices 251 through 274 independently
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import textwrap

          root = Path('/tmp/p2-09d-corpus')
          rows = sorted(
              p for p in root.rglob('*')
              if p.is_file() and p.name.casefold().endswith('.evtx')
          )
          assert len(rows) == 352, len(rows)

          helper = Path(tempfile.gettempdir()) / 'parse_one_evtx.py'
          helper.write_text(
              textwrap.dedent('''\
                  import sys
                  import time
                  from Evtx.Evtx import Evtx

                  path = sys.argv[1]
                  start = time.perf_counter()
                  count = 0
                  with Evtx(path) as log:
                      for record in log.records():
                          record.xml()
                          count += 1
                  print(
                      f"OK records={count} seconds={time.perf_counter()-start:.3f}",
                      flush=True,
                  )
              '''),
              encoding='utf-8',
          )

          timed_out = []
          failed = []
          for index in range(251, 275):
              path = rows[index - 1]
              rel = path.relative_to(root).as_posix()
              size = path.stat().st_size
              print(f'TEST {index:03d} size={size} {rel}', flush=True)
              try:
                  completed = subprocess.run(
                      [sys.executable, '-u', str(helper), str(path)],
                      text=True,
                      capture_output=True,
                      timeout=10,
                      check=False,
                  )
              except subprocess.TimeoutExpired:
                  timed_out.append(index)
                  print(f'RESULT {index:03d} TIMEOUT>10s', flush=True)
                  continue
              if completed.returncode != 0:
                  failed.append(index)
              print(
                  f'RESULT {index:03d} rc={completed.returncode} '
                  f'stdout={completed.stdout.strip()!r} stderr={completed.stderr.strip()!r}',
                  flush=True,
              )

          print(f'SUMMARY timed_out={timed_out} failed={failed}', flush=True)
          PY
