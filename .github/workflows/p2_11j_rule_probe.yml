name: P2-11J Rule Probe
on:
  push:
    branches: [analysis/p2-11j-rule-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements-lock-py311.txt
      - name: Install exact environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Focused tests and rule validation
        run: |
          python -m pytest -q tests/test_p2_11j_networkprovider_credential_capture_rule.py
          python scripts/run.py --validate-rules
          python scripts/evaluate_external_holdout.py freeze --repo . --rules-dir rules --out "$RUNNER_TEMP/p2-11j-rules-freeze.json"
          cat "$RUNNER_TEMP/p2-11j-rules-freeze.json"
