name: P2-10G Distributed Benign Predicate Scan

on:
  push:
    branches: [probe/p2-10g-hidden-run-key]

permissions:
  contents: read
  actions: read

env:
  CORPUS_URL: https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
  CORPUS_SHA256: d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e
  SYSMON_REL: Logs_Client/Microsoft-Windows-Sysmon%4Operational.evtx

jobs:
  shard:
    name: Scan ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: sysmon-0, start: 0, end: 1487}
          - {id: sysmon-1, start: 1487, end: 2974}
          - {id: sysmon-2, start: 2974, end: 4461}
          - {id: sysmon-3, start: 4461, end: 5948}
          - {id: sysmon-4, start: 5948, end: 7435}
          - {id: sysmon-5, start: 7435, end: 8922}
          - {id: sysmon-6, start: 8922, end: 10408}
          - {id: sysmon-7, start: 10408, end: 11894}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11.16
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.16
          cache: pip

      - name: Install exact locked environment
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Download and verify pinned Sysmon corpus source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error -o /tmp/win10-client.tgz "$CORPUS_URL"
          echo "$CORPUS_SHA256  /tmp/win10-client.tgz" | sha256sum -c -
          rm -rf /tmp/p2-10g-corpus && mkdir -p /tmp/p2-10g-corpus
          tar -xzf /tmp/win10-client.tgz -C /tmp/p2-10g-corpus "$SYSMON_REL"
          test -f "/tmp/p2-10g-corpus/$SYSMON_REL"

      - name: Scan assigned Sysmon chunk range
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_ID: ${{ matrix.id }}
          CHUNK_START: ${{ matrix.start }}
          CHUNK_END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          mkdir -p shard-out
          python -u - <<'PY'
          import itertools
          import json
          import os
          import re
          import time
          from pathlib import Path
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          shard_id = os.environ['SHARD_ID']
          start = int(os.environ['CHUNK_START'])
          end = int(os.environ['CHUNK_END'])
          path = Path('/tmp/p2-10g-corpus') / os.environ['SYSMON_REL']
          event13_re = re.compile(r'<EventID(?:\s[^>]*)?>13</EventID>', re.I)

          def norm_target(value):
              return str(value or '').strip().replace('/', '\\').casefold()

          def run_like(target):
              t = norm_target(target)
              return ('\\software\\microsoft\\windows\\currentversion\\run\\' in t or
                      '\\software\\microsoft\\windows\\currentversion\\runonce\\' in t)

          def hidden_run_target(target):
              t = norm_target(target)
              return (t.endswith('\\software\\microsoft\\windows\\currentversion\\run\\') or
                      t.endswith('\\software\\microsoft\\windows\\currentversion\\runonce\\'))

          with Evtx(str(path)) as log:
              total_chunks = sum(1 for _ in log.chunks())
          if total_chunks != 11894:
              raise SystemExit(f'expected 11894 chunks, got {total_chunks}')
          if not (0 <= start < end <= total_chunks):
              raise SystemExit(f'invalid chunk range {start}:{end}')

          event_count = 0
          raw_filtered13 = 0
          parsed13 = 0
          setvalue13 = 0
          run_targets = 0
          hidden_targets = 0
          exact_candidates = 0
          xml_errors = 0
          parse13_errors = 0
          examples = []
          began = time.perf_counter()

          with Evtx(str(path)) as log:
              for chunk in itertools.islice(log.chunks(), start, end):
                  for record in chunk.records():
                      event_count += 1
                      try:
                          xml = record.xml()
                      except Exception as exc:
                          xml_errors += 1
                          print('XML_ERROR=', repr(exc), flush=True)
                          continue
                      if not event13_re.search(xml):
                          continue
                      raw_filtered13 += 1
                      try:
                          d = _extract_from_xml(xml)
                      except Exception as exc:
                          parse13_errors += 1
                          print('EVENT13_PARSE_ERROR=', repr(exc), flush=True)
                          continue
                      if str(d.get('source', '')) != 'Microsoft-Windows-Sysmon' or str(d.get('event_id', '')) != '13':
                          raise SystemExit(f'filter mismatch: {d.get("source")} {d.get("event_id")}')
                      parsed13 += 1
                      raw = d.get('raw') if isinstance(d.get('raw'), dict) else d
                      event_type = str(raw.get('EventType', ''))
                      target = str(raw.get('TargetObject', ''))
                      if event_type.casefold() == 'setvalue':
                          setvalue13 += 1
                      if run_like(target):
                          run_targets += 1
                      if hidden_run_target(target):
                          hidden_targets += 1
                      if event_type.casefold() == 'setvalue' and hidden_run_target(target):
                          exact_candidates += 1
                          examples.append({
                              'Image': raw.get('Image'),
                              'TargetObject': target,
                              'Details': raw.get('Details'),
                              'RuleName': raw.get('RuleName'),
                          })

          payload = {
              'schema': 'breachscope.p2_10g.hidden_run_benign_shard.v1',
              'shard_id': shard_id,
              'chunk_start': start,
              'chunk_end': end,
              'total_chunks': total_chunks,
              'corpus_sha256': os.environ['CORPUS_SHA256'],
              'event_count': event_count,
              'raw_filtered_sysmon_event13': raw_filtered13,
              'parsed_sysmon_event13': parsed13,
              'sysmon_event13_setvalue': setvalue13,
              'run_or_runonce_targets': run_targets,
              'hidden_run_targets': hidden_targets,
              'exact_candidate_matches': exact_candidates,
              'xml_errors': xml_errors,
              'event13_parse_errors': parse13_errors,
              'examples': examples,
              'wall_seconds': time.perf_counter() - began,
          }
          out = Path('shard-out') / f'{shard_id}.json'
          out.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          print('SHARD_RESULT=', json.dumps(payload, ensure_ascii=False), flush=True)
          PY

      - name: Upload shard result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10g-${{ matrix.id }}
          path: shard-out/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Aggregate P2-10G benign predicate scan
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: p2-10g-sysmon-*
          path: shard-results
          merge-multiple: true

      - name: Aggregate and enforce coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aggregate-out
          python - <<'PY'
          import json
          from pathlib import Path

          ranges = [
              (0, 1487), (1487, 2974), (2974, 4461), (4461, 5948),
              (5948, 7435), (7435, 8922), (8922, 10408), (10408, 11894),
          ]
          root = Path('shard-results')
          files = sorted(root.glob('*.json'))
          if len(files) != 8:
              raise SystemExit(f'expected 8 shard results, got {len(files)}')
          rows = [json.loads(p.read_text(encoding='utf-8')) for p in files]
          by_id = {row['shard_id']: row for row in rows}
          for i, expected in enumerate(ranges):
              row = by_id[f'sysmon-{i}']
              actual = (int(row['chunk_start']), int(row['chunk_end']))
              if actual != expected or int(row['total_chunks']) != 11894:
                  raise SystemExit(f'coverage mismatch sysmon-{i}: {actual}')
              if row['corpus_sha256'] != 'd48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e':
                  raise SystemExit('corpus hash mismatch across shards')

          keys = [
              'event_count', 'raw_filtered_sysmon_event13', 'parsed_sysmon_event13',
              'sysmon_event13_setvalue', 'run_or_runonce_targets', 'hidden_run_targets',
              'exact_candidate_matches', 'xml_errors', 'event13_parse_errors',
          ]
          totals = {key: sum(int(row[key]) for row in rows) for key in keys}
          examples = [item for row in rows for item in row['examples']]
          if totals['event_count'] != 732200:
              raise SystemExit(f"expected 732200 Sysmon events, got {totals['event_count']}")
          if totals['raw_filtered_sysmon_event13'] != totals['parsed_sysmon_event13']:
              raise SystemExit('Event 13 raw filter / parser count mismatch')
          if totals['xml_errors'] or totals['event13_parse_errors']:
              raise SystemExit(f"parse errors: xml={totals['xml_errors']} event13={totals['event13_parse_errors']}")

          summary = {
              'schema': 'breachscope.p2_10g.hidden_run_benign_scan.v1',
              'corpus_sha256': 'd48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e',
              'evtx_files_total_from_p2_09d': 352,
              'corpus_total_events_from_p2_09d': 766623,
              'sysmon_chunks_covered': '0:11894',
              **totals,
              'examples': examples,
          }
          Path('aggregate-out/summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print('P2_10G_BENIGN_SUMMARY=', json.dumps(summary, ensure_ascii=False))
          PY

      - name: Upload aggregate result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10g-benign-aggregate
          path: aggregate-out/summary.json
          if-no-files-found: error
          retention-days: 7
