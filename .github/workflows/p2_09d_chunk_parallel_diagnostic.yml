name: P2-09D Chunk Parallel Diagnostic

on:
  push:
    branches:
      - measure/p2-09d-chunk-parallel

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact measured main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 789c1f45b35599adbb5816c69c2e1e5c586584c9
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.16

      - name: Install exact locked product environment
        shell: bash
        run: python -m pip install --require-hashes -r requirements-lock-py311.txt

      - name: Download and verify pinned corpus
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error -o /tmp/win10-client.tgz \
            https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.4/win10-client.tgz
          echo "d48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e  /tmp/win10-client.tgz" | sha256sum -c -
          rm -rf /tmp/p2-09d-corpus && mkdir -p /tmp/p2-09d-corpus
          tar -xzf /tmp/win10-client.tgz -C /tmp/p2-09d-corpus

      - name: Write semantic-preserving parallel helper
        shell: bash
        run: |
          cat > parallel_evtx_diag.py <<'PY'
          from __future__ import annotations
          import argparse, hashlib, itertools, json, multiprocessing, shutil, time
          from concurrent.futures import ProcessPoolExecutor, as_completed
          from pathlib import Path
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          def canonical(row):
              return json.dumps(row, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode("utf-8") + b"\n"

          def count_chunks(path):
              with Evtx(str(path)) as log:
                  return sum(1 for _ in log.chunks())

          def ranges(total, workers):
              workers = max(1, min(workers, total))
              base, rem = divmod(total, workers)
              out, start = [], 0
              for i in range(workers):
                  end = start + base + (1 if i < rem else 0)
                  out.append((start, end))
                  start = end
              return out

          def render(path, start, end, out_path):
              begun, count = time.perf_counter(), 0
              with Evtx(path) as log, Path(out_path).open("w", encoding="utf-8", newline="\n") as target:
                  for chunk in itertools.islice(log.chunks(), start, end):
                      for record in chunk.records():
                          row = _extract_from_xml(record.xml())
                          if row:
                              target.write(json.dumps(row, ensure_ascii=False) + "\n")
                              count += 1
              return start, end, count, time.perf_counter() - begun

          def digest_jsonl(path):
              digest, count = hashlib.sha256(), 0
              with Path(path).open("r", encoding="utf-8") as source:
                  for line in source:
                      if line.strip():
                          digest.update(canonical(json.loads(line)))
                          count += 1
              return count, digest.hexdigest()

          def sequential(path):
              begun, digest, count = time.perf_counter(), hashlib.sha256(), 0
              with Evtx(str(path)) as log:
                  for record in log.records():
                      row = _extract_from_xml(record.xml())
                      if row:
                          digest.update(canonical(row))
                          count += 1
              return count, digest.hexdigest(), time.perf_counter() - begun

          def parallel(path, workers, output):
              begun = time.perf_counter()
              total = count_chunks(path)
              work = ranges(total, workers)
              parts = Path(str(output) + ".parts")
              shutil.rmtree(parts, ignore_errors=True)
              parts.mkdir(parents=True)
              ctx = multiprocessing.get_context("fork")
              with ProcessPoolExecutor(max_workers=len(work), mp_context=ctx) as pool:
                  futures = []
                  for i, (start, end) in enumerate(work):
                      part = parts / f"{i:03d}.jsonl"
                      futures.append(pool.submit(render, str(path), start, end, str(part)))
                  for future in as_completed(futures):
                      start, end, count, seconds = future.result()
                      print(f"RANGE chunks={start}:{end} events={count} seconds={seconds:.3f}", flush=True)
              with Path(output).open("wb") as target:
                  for i in range(len(work)):
                      with (parts / f"{i:03d}.jsonl").open("rb") as source:
                          shutil.copyfileobj(source, target, 1024 * 1024)
              count, digest = digest_jsonl(output)
              shutil.rmtree(parts, ignore_errors=True)
              return count, digest, time.perf_counter() - begun, total

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("path", type=Path)
              ap.add_argument("--workers", type=int, default=8)
              ap.add_argument("--out", type=Path, required=True)
              ap.add_argument("--compare", action="store_true")
              args = ap.parse_args()
              if args.compare:
                  sc, sh, ss = sequential(args.path)
                  print(f"SEQUENTIAL count={sc} sha256={sh} seconds={ss:.3f}", flush=True)
              else:
                  sc = sh = None
              pc, ph, ps, chunks = parallel(args.path, args.workers, args.out)
              print(f"PARALLEL chunks={chunks} workers={args.workers} count={pc} sha256={ph} seconds={ps:.3f} bytes={args.out.stat().st_size}", flush=True)
              if args.compare:
                  print(f"COUNT_MATCH={sc == pc}", flush=True)
                  print(f"NORMALIZED_HASH_MATCH={sh == ph}", flush=True)
                  if sc != pc or sh != ph:
                      return 3
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Prove equivalence on Shell-Core EVTX
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          PATH249=$(python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/p2-09d-corpus')
          rows=sorted(p for p in root.rglob('*') if p.is_file() and p.name.casefold().endswith('.evtx'))
          print(rows[248])
          PY
          )
          echo "INDEX249=$PATH249"
          python -u parallel_evtx_diag.py "$PATH249" --workers 4 --out /tmp/index249.jsonl --compare

      - name: Parse full 799 MB Sysmon with identical python-evtx semantics
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          SYSMON=$(python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/p2-09d-corpus')
          rows=sorted(p for p in root.rglob('*') if p.is_file() and p.name.casefold().endswith('.evtx'))
          print(rows[272])
          PY
          )
          echo "SYSMON=$SYSMON"
          python -u parallel_evtx_diag.py "$SYSMON" --workers 8 --out /tmp/sysmon.jsonl
          ls -lh /tmp/sysmon.jsonl
