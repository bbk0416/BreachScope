name: P2-10 Event ID Priority Probe

on:
  push:
    branches: ["probe/p2-10-eventid-priority"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Scan exact candidate predicates across all non-Sysmon benign EVTX
        run: |
          python - <<'PY'
          import hashlib
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from collections import Counter
          from pathlib import Path

          import yaml
          from Evtx.Evtx import Evtx
          from breachscope.ingest import _extract_from_xml

          root = Path.cwd()
          recipe = yaml.safe_load((root / "external_baseline/p2_09d_benign_sources.yaml").read_text(encoding="utf-8"))
          source = recipe["source"]
          work = Path(tempfile.mkdtemp(prefix="p2-10-predicate-probe-"))
          archive = work / source["asset_name"]

          request = urllib.request.Request(source["asset_url"], headers={"User-Agent": "BreachScope-P2-10-Probe/1.0"})
          with urllib.request.urlopen(request, timeout=300) as response, archive.open("wb") as out:
              shutil.copyfileobj(response, out, length=1024 * 1024)

          size = archive.stat().st_size
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert size == int(source["size"]), (size, source["size"])
          assert digest == source["sha256"], (digest, source["sha256"])
          print(f"archive_verified size={size} sha256={digest}")

          sysmon_name = "Logs_Client/Microsoft-Windows-Sysmon%4Operational.evtx"
          predicates = Counter()
          event_id_counts = Counter()
          provider_event_counts = Counter()
          total_events = 0
          source_files = 0
          examples_7045 = []
          temp_evtx = work / "current.evtx"

          with tarfile.open(archive, "r:gz") as tf:
              members = [
                  m for m in tf.getmembers()
                  if m.isfile() and m.name.casefold().endswith(".evtx") and m.name != sysmon_name
              ]
              assert len(members) == 351, len(members)

              for index, member in enumerate(members, 1):
                  src = tf.extractfile(member)
                  assert src is not None
                  with src, temp_evtx.open("wb") as out:
                      shutil.copyfileobj(src, out, length=1024 * 1024)

                  source_files += 1
                  try:
                      with Evtx(str(temp_evtx)) as log:
                          for record in log.records():
                              row = _extract_from_xml(record.xml())
                              if not row:
                                  continue
                              total_events += 1
                              event_id = str(row.get("event_id") or "")
                              provider = str(row.get("source") or "")
                              event_id_counts[event_id] += 1
                              provider_event_counts[(provider, event_id)] += 1

                              if provider == "Microsoft-Windows-Security-Auditing" and event_id == "4698":
                                  predicates["security_auditing_4698"] += 1
                              if provider == "Microsoft-Windows-Security-Auditing" and event_id == "4699":
                                  predicates["security_auditing_4699"] += 1
                              if provider == "Service Control Manager" and event_id == "7045":
                                  predicates["scm_7045"] += 1
                                  if len(examples_7045) < 5:
                                      raw = row.get("raw") or {}
                                      examples_7045.append((str(raw.get("ServiceName") or "")[:100], str(raw.get("ImagePath") or "")[:180]))
                  except Exception as exc:
                      raise RuntimeError(f"failed parsing {member.name}: {exc}") from exc

                  if index % 50 == 0 or index == len(members):
                      print(f"progress={index}/{len(members)} events={total_events}")

          print(f"source_files={source_files}")
          print(f"events={total_events}")
          print(f"security_auditing_4698={predicates['security_auditing_4698']}")
          print(f"security_auditing_4699={predicates['security_auditing_4699']}")
          print(f"scm_7045={predicates['scm_7045']}")
          print(f"event_id_4698_any_provider={event_id_counts['4698']}")
          print(f"event_id_4699_any_provider={event_id_counts['4699']}")
          print(f"event_id_7045_any_provider={event_id_counts['7045']}")
          print(f"scm_7045_examples={examples_7045!r}")

          assert source_files == 351
          assert total_events == 34423, total_events
          assert predicates["security_auditing_4698"] == 0
          assert predicates["security_auditing_4699"] == 0
          assert predicates["scm_7045"] == 26
          PY
