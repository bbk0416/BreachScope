name: P2-10 Event ID Priority Probe

on:
  push:
    branches: ["probe/p2-10-eventid-priority"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Count candidate Event IDs in pinned benign Security/System logs
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import tarfile
          import tempfile
          import urllib.request
          from collections import Counter
          from pathlib import Path

          import yaml
          from breachscope.ingest import convert_evtx_dir

          root = Path.cwd()
          recipe = yaml.safe_load((root / "external_baseline/p2_09d_benign_sources.yaml").read_text(encoding="utf-8"))
          source = recipe["source"]
          work = Path(tempfile.mkdtemp(prefix="p2-10-eventid-probe-"))
          archive = work / source["asset_name"]

          request = urllib.request.Request(source["asset_url"], headers={"User-Agent": "BreachScope-P2-10-Probe/1.0"})
          with urllib.request.urlopen(request, timeout=300) as response, archive.open("wb") as out:
              shutil.copyfileobj(response, out, length=1024 * 1024)

          size = archive.stat().st_size
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert size == int(source["size"]), (size, source["size"])
          assert digest == source["sha256"], (digest, source["sha256"])
          print(f"archive_verified size={size} sha256={digest}")

          wanted = {
              "Logs_Client/Security.evtx": "Security.evtx",
              "Logs_Client/System.evtx": "System.evtx",
          }
          input_dir = work / "input"
          input_dir.mkdir()
          found = set()
          with tarfile.open(archive, "r:gz") as tf:
              for member in tf.getmembers():
                  if member.name not in wanted:
                      continue
                  src = tf.extractfile(member)
                  assert src is not None
                  target = input_dir / wanted[member.name]
                  with src, target.open("wb") as out:
                      shutil.copyfileobj(src, out, length=1024 * 1024)
                  found.add(member.name)
          assert found == set(wanted), (found, set(wanted))

          converted = convert_evtx_dir(input_dir)
          assert converted is not None
          converted = Path(converted)
          target_ids = {"4698", "4699", "7045"}
          overall = Counter()
          result = {}
          examples = []

          for path in sorted(converted.glob("*.jsonl")):
              counts = Counter()
              total = 0
              with path.open(encoding="utf-8") as fh:
                  for line in fh:
                      row = json.loads(line)
                      event_id = str(row.get("event_id") or "")
                      counts[event_id] += 1
                      overall[event_id] += 1
                      total += 1
                      if event_id in target_ids and len(examples) < 20:
                          raw = row.get("raw") or {}
                          examples.append({
                              "file": path.name,
                              "event_id": event_id,
                              "timestamp": row.get("timestamp"),
                              "user": row.get("user"),
                              "TaskName": str(raw.get("TaskName") or "")[:240],
                              "TaskContent": str(raw.get("TaskContent") or "")[:240],
                              "ServiceName": str(raw.get("ServiceName") or "")[:240],
                              "ImagePath": str(raw.get("ImagePath") or "")[:240],
                              "ServiceFileName": str(raw.get("ServiceFileName") or "")[:240],
                              "AccountName": str(raw.get("AccountName") or "")[:240],
                          })
              result[path.name] = {
                  "events": total,
                  "4698": counts["4698"],
                  "4699": counts["4699"],
                  "7045": counts["7045"],
              }

          print("P2_10_EVENT_ID_COUNTS=" + json.dumps(result, sort_keys=True))
          print("P2_10_TARGET_EXAMPLES=" + json.dumps(examples, ensure_ascii=False, sort_keys=True))
          assert sum(item["events"] for item in result.values()) == 4316, result
          PY
