name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.21", "3.11.16", "3.12.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system packages for Korean PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-nanum fontconfig

      - name: Install dependencies
        run: |
          LOCK="requirements-lock-py$(python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")').txt"
          python -m pip install --require-hashes -r "$LOCK"
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Static compile check
        run: python -m compileall -q breachscope api scripts tests

      - name: Unit tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          python scripts/run.py --demo-scenario all --out out_ci/report --export-json --export-csv --pdf
          test -f out_ci/report.html
          test -f out_ci/report.json
          test -f out_ci/report.csv
          test -f out_ci/report.iocs.csv
          test -f out_ci/report.rules.csv
          test -f out_ci/report.manifest.json
          test -f out_ci/report.zip
          test -f out_ci/report.pdf

      - name: Rulepack validation
        run: python scripts/run.py --validate-rules

      - name: Project readiness check
        run: python scripts/project_check.py --strict

      - name: Quality gate
        run: python scripts/quality_gate.py --strict

      - name: Go-live check
        run: |
          mkdir -p "$RUNNER_TEMP/breachscope/cases" "$RUNNER_TEMP/breachscope/backups"
          python scripts/init_env.py --production --https --output "$RUNNER_TEMP/.env.ci"
          set -a
          . "$RUNNER_TEMP/.env.ci"
          set +a
          export BS_CASES_ROOT="$RUNNER_TEMP/breachscope/cases"
          export BS_CASE_HISTORY_PATH="$RUNNER_TEMP/breachscope/case_history.json"
          export BS_AUDIT_LOG_PATH="$RUNNER_TEMP/breachscope/audit.jsonl"
          export BS_BACKUP_ROOT="$RUNNER_TEMP/breachscope/backups"
          python scripts/go_live_check.py --deployment-mode production

      - name: Static showcase build
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_showcase.py --clean --no-pdf
          test -f out/showcase/index.html
          test -f out/showcase/assets/social-preview.svg
          test -f out/showcase/data/showcase_summary.json
          test -f out/showcase/breachscope-showcase.zip

      - name: Public publish prep build
        if: matrix.python-version == '3.11'
        run: |
          python scripts/publish_prep.py --clean --no-pdf
          test -f out/publish/PUBLIC_LAUNCH_SUMMARY.md
          test -f out/publish/GITHUB_PUBLISH_COMMANDS.md
          test -f out/publish/RELEASE_NOTE_DRAFT.md
          test -f out/publish/publish_manifest.json
          test -f out/publish/breachscope-public-launch-pack.zip

      - name: Upload demo report artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: breachscope-demo-report
          path: |
            out_ci/report.html
            out_ci/report.json
            out_ci/report.csv
            out_ci/report.iocs.csv
            out_ci/report.rules.csv
            out_ci/report.manifest.json
            out_ci/report.zip
            out_ci/report.pdf
            out/showcase/index.html
            out/showcase/assets/social-preview.svg
            out/showcase/data/showcase_summary.json
            out/showcase/breachscope-showcase.zip
            out/publish/PUBLIC_LAUNCH_SUMMARY.md
            out/publish/GITHUB_PUBLISH_COMMANDS.md
            out/publish/RELEASE_NOTE_DRAFT.md
            out/publish/publish_manifest.json
            out/publish/breachscope-public-launch-pack.zip
          if-no-files-found: error

  windows-test:
    name: Windows Python 3.11
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Static compile check
        run: python -m compileall -q breachscope api scripts tests

      - name: Windows path, EVTX contract, and case-history lock tests
        run: pytest -q tests/test_p2_05d_real_evtx_contract.py tests/test_case_history_mutation_lock.py tests/test_workdir_boundary.py

      - name: Full Windows unit tests
        run: pytest -q

      - name: Native Windows EVTX collect and convert smoke
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os

          from breachscope.ingest import collect_windows_logs, convert_evtx_dir

          root = Path(os.environ["RUNNER_TEMP"]) / "breachscope windows smoke" / "collected"
          collected = collect_windows_logs(root, log_names=["System"])
          if collected is None:
              raise SystemExit("Windows System EVTX collection returned no directory")
          evtx_files = list(Path(collected).glob("*.evtx"))
          if not evtx_files:
              raise SystemExit("Windows System EVTX collection produced no EVTX file")
          converted = convert_evtx_dir(Path(collected))
          if converted is None:
              raise SystemExit("EVTX conversion returned no output directory")
          jsonl_files = list(Path(converted).glob("*.jsonl"))
          if not jsonl_files or not any(path.stat().st_size > 0 for path in jsonl_files):
              raise SystemExit("EVTX conversion produced no non-empty JSONL output")
          print(f"collected={evtx_files[0]}")
          print(f"converted={jsonl_files[0]}")
          '@ | python -

      - name: Windows CLI smoke test
        shell: pwsh
        run: |
          python scripts/run.py --demo-scenario all --out "out_ci_win/report" --export-json --export-csv
          $required = @(
            "out_ci_win/report.html",
            "out_ci_win/report.json",
            "out_ci_win/report.csv",
            "out_ci_win/report.iocs.csv",
            "out_ci_win/report.rules.csv",
            "out_ci_win/report.manifest.json",
            "out_ci_win/report.zip"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows CI artifact: $path"
            }
          }

      - name: Rulepack validation
        run: python scripts/run.py --validate-rules
