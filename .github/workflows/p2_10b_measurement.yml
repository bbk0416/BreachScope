name: P2-10B WMI XSL Measurement

on:
  push:
    branches:
      - fix/p2-10b-wmi-xsl

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/verify_dependency_locks.py --strict

      - name: Focused rule tests
        run: python -m pytest -q tests/test_p2_10_wmi_xsl_rule.py

      - name: Run pinned external attack baseline
        run: python scripts/run_external_baseline.py --out out/p2_10b_attack --timeout 120

      - name: Assert attack-side improvement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('out/p2_10b_attack/summary.json').read_text(encoding='utf-8'))
          metrics = summary['primary_metrics']
          outcomes = {row['scenario_id']: row for row in summary['scenarios']}
          assert metrics['scenario_hits'] == 4, metrics
          assert metrics['scenario_misses'] == 6, metrics
          assert metrics['scenario_total'] == 10, metrics
          wmi_xsl = outcomes['exec-wmi-xsl']
          assert wmi_xsl['status'] == 'hit', wmi_xsl
          assert 'T1047' in wmi_xsl['matched_techniques'], wmi_xsl
          lm_wmi = outcomes['lm-wmi']
          assert lm_wmi['status'] == 'miss', lm_wmi
          print('P2-10B attack delta: PASS 3/10 -> 4/10')
          print('rules_tree_sha256=' + summary['rules_tree_sha256'])
          print('findings=' + str(summary['detection_observation']['findings']))
          PY

      - name: Write measurement record
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml

          summary = json.loads(Path('out/p2_10b_attack/summary.json').read_text(encoding='utf-8'))
          payload = {
              'schema': 'breachscope.p2_10b_measurement.v1',
              'evaluated_repo_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'from_rules_tree_sha256': '8ade507d0abf4a0495b44cde4268245dab8c5f9d58d2eb5b47ebee8b7a5de185',
              'to_rules_tree_sha256': summary['rules_tree_sha256'],
              'change': {
                  'rule_id': 'R-WMI-XSL-Remote',
                  'predicate': {
                      'command_line_contains': ['wmic', '/format:"http'],
                      'event_id_equals': '1',
                      'source_equals': 'Microsoft-Windows-Sysmon',
                  },
                  'mitre_technique': 'T1047',
              },
              'attack_external_baseline': {
                  'baseline_id': summary['baseline_id'],
                  'before_scenario_hits': 3,
                  'scenario_hits': summary['primary_metrics']['scenario_hits'],
                  'scenario_misses': summary['primary_metrics']['scenario_misses'],
                  'scenario_total': summary['primary_metrics']['scenario_total'],
                  'findings': summary['detection_observation']['findings'],
                  'changed_scenario': 'exec-wmi-xsl',
                  'changed_scenario_status': next(row['status'] for row in summary['scenarios'] if row['scenario_id'] == 'exec-wmi-xsl'),
                  'lm_wmi_status': next(row['status'] for row in summary['scenarios'] if row['scenario_id'] == 'lm-wmi'),
              },
              'benign_incremental_match_proof': {
                  'baseline_id': 'p2-09d-nextron-win10-v1',
                  'corpus_sha256': 'd48f1b328d48db6c6dfaa9b6e232dbb454d93e833c6e1248efc0faf690b6808e',
                  'sysmon_records_scanned': 732200,
                  'raw_wmic_records': 29,
                  'event1_wmic': 0,
                  'event1_wmic_format': 0,
                  'exact_candidate_matches': 0,
                  'probe_run_id': 34225137121,
                  'probe_commit': '0165c7bb75d8017543d1b60608680afe983f434d',
                  'parser': 'python-evtx 0.8.1 plus breachscope.ingest._extract_from_xml on raw-prefiltered candidate records',
                  'fresh_full_fp_tn_rerun': False,
              },
              'claim_boundary': {
                  'production_detection_rate': 'NOT_CLAIMED',
                  'production_false_positive_rate': 'NOT_CLAIMED',
                  'fresh_full_benign_fpr_for_new_rulepack': 'NOT_CLAIMED',
                  'final_blind_holdout': False,
              },
          }
          Path('out/p2_10b_measurement.yaml').write_text(
              yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding='utf-8'
          )
          PY

      - name: Upload measurement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-10b-wmi-xsl-measurement
          path: |
            out/p2_10b_attack/rules_freeze.json
            out/p2_10b_attack/manifest.yaml
            out/p2_10b_attack/result.json
            out/p2_10b_attack/summary.json
            out/p2_10b_attack/SUMMARY.md
            out/p2_10b_measurement.yaml
          if-no-files-found: error
