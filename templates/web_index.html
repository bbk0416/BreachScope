<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreachScope Web UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 6px;
        }
        .form-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 4px;
            background: white;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #357abd;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #4a90e2;
            width: 100%;
            margin-top: 20px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .download-links {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .download-btn {
            background: #28a745;
            padding: 10px 20px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            display: inline-block;
        }
        .download-btn:hover {
            background: #218838;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a90e2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ BreachScope Web UI</h1>
        <p class="subtitle">로그 업로드 → 규칙 선택 → 분석 → 리포트 다운로드</p>

        <form id="analyzeForm" enctype="multipart/form-data">
            <!-- 로그 업로드 -->
            <div class="form-section">
                <h2>로그 업로드</h2>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="collectEvtx" name="collect_evtx">
                    <label for="collectEvtx">Windows 이벤트 로그 자동 수집 (관리자 권한 권장)</label>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="workDirPath">작업 디렉토리 경로 (선택사항, 권한 문제 시 사용)</label>
                    <input type="text" id="workDirPath" name="work_dir" placeholder="예: D:\Project\BreachScope\work_temp 또는 C:\Users\사용자명\Documents\breachscope_work" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;">
                    <small style="color: #666; font-size: 0.85em; display: block; margin-top: 5px;">
                        💡 권한 문제가 발생하면 쓰기 권한이 있는 디렉토리 경로를 직접 입력하세요. 비워두면 기본 임시 디렉토리를 사용합니다.
                    </small>
                </div>
                <div id="collectOptions" style="display: none; margin-left: 30px; margin-top: 10px;">
                    <div class="form-group">
                        <label for="collectLogs">수집할 로그 (쉼표 구분, 기본: Security,System,Application,PowerShell)</label>
                        <input type="text" id="collectLogs" name="collect_logs" placeholder="예: Security,System,Application">
                    </div>
                    <div class="form-group">
                        <label for="collectHours">최근 N시간만 수집 (비워두면 전체)</label>
                        <input type="number" id="collectHours" name="collect_hours" min="1" placeholder="예: 24">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="logFiles">또는 JSONL/EVTX 파일 업로드 (여러 개 선택 가능)</label>
                    <input type="file" id="logFiles" name="files" multiple accept=".jsonl,.evtx">
                </div>
            </div>

            <!-- 규칙 선택 -->
            <div class="form-section">
                <h2>규칙 선택</h2>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="useRepoRules" name="use_repo_rules" checked>
                    <label for="useRepoRules">저장소의 rules/ 사용</label>
                </div>
            </div>

            <!-- 옵션 설정 -->
            <div class="form-section">
                <h2>옵션 설정</h2>
                <div class="two-column">
                    <div class="form-group">
                        <label for="minSeverity">최소 심각도</label>
                        <select id="minSeverity" name="min_severity">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mitreInclude">포함 TTP (쉼표 구분)</label>
                        <input type="text" id="mitreInclude" name="mitre_include" placeholder="예: T1059.001,T1105">
                    </div>
                </div>
                <div class="two-column">
                    <div class="form-group">
                        <label for="mitreExclude">제외 TTP (쉼표 구분)</label>
                        <input type="text" id="mitreExclude" name="mitre_exclude" placeholder="예: T1003">
                    </div>
                    <div class="form-group">
                        <label for="hostInclude">호스트 포함 (쉼표 구분)</label>
                        <input type="text" id="hostInclude" name="host_include" placeholder="예: WS-01,WS-02">
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="redact" name="redact" checked>
                    <label for="redact">보고서 마스킹 활성화 (권장)</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="renderPdf" name="render_pdf">
                    <label for="renderPdf">PDF 생성 (환경 구성 필요)</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="doEvtx" name="do_evtx">
                    <label for="doEvtx">EVTX 자동 변환 (python-evtx 필요)</label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="analyzeBtn">분석 실행</button>
        </form>

        <!-- 로딩 표시 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>분석 중...</p>
        </div>

        <!-- 결과 표시 -->
        <div id="results"></div>
    </div>

    <script>
        const form = document.getElementById('analyzeForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const analyzeBtn = document.getElementById('analyzeBtn');

        // 이벤트 로그 수집 옵션 표시/숨김
        document.getElementById('collectEvtx').addEventListener('change', (e) => {
            const options = document.getElementById('collectOptions');
            const fileInput = document.getElementById('logFiles');
            if (e.target.checked) {
                options.style.display = 'block';
                fileInput.removeAttribute('required');
            } else {
                options.style.display = 'none';
                fileInput.setAttribute('required', '');
            }
        });

        // 작업 디렉토리 경로 입력 필드 - 간단한 유효성 검사
        const workDirPathInput = document.getElementById('workDirPath');
        if (workDirPathInput) {
            workDirPathInput.addEventListener('blur', () => {
                const path = workDirPathInput.value.trim();
                if (path) {
                    // 경로 형식 간단 검사 (Windows 경로)
                    if (path.length > 0 && !path.includes('..')) {
                        // 유효한 경로로 보임
                        workDirPathInput.style.borderColor = '#28a745';
                    } else {
                        workDirPathInput.style.borderColor = '#dc3545';
                    }
                } else {
                    workDirPathInput.style.borderColor = '#ddd';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI 업데이트
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                const formData = new FormData(form);
                const useRepoRules = document.getElementById('useRepoRules').checked;
                formData.append('use_repo_rules', useRepoRules);

                const collectEvtx = document.getElementById('collectEvtx').checked;
                formData.append('collect_evtx', collectEvtx);

                const collectHours = document.getElementById('collectHours').value;
                if (collectHours) {
                    formData.append('collect_hours', parseInt(collectHours));
                }

                const workDirPath = document.getElementById('workDirPath').value;
                if (workDirPath) {
                    formData.append('work_dir', workDirPath);
                }

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '분석 실패');
                }

                const data = await response.json();

                // 결과 표시
                let html = `<div class="alert alert-success">
                    <strong>분석 완료!</strong> 탐지 ${data.count}건이 발견되었습니다.
                </div>`;

                html += '<div class="download-links">';
                html += `<a href="/api/report/${encodeURIComponent(data.work_dir)}?file_type=html" class="download-btn" download>HTML 다운로드</a>`;

                if (data.json_path) {
                    html += `<a href="/api/report/${encodeURIComponent(data.work_dir)}?file_type=json" class="download-btn" download>JSON 다운로드</a>`;
                }
                if (data.csv_path) {
                    html += `<a href="/api/report/${encodeURIComponent(data.work_dir)}?file_type=csv" class="download-btn" download>CSV 다운로드</a>`;
                }
                if (data.pdf_path) {
                    html += `<a href="/api/report/${encodeURIComponent(data.work_dir)}?file_type=pdf" class="download-btn" download>PDF 다운로드</a>`;
                }
                html += '</div>';

                results.innerHTML = html;

            } catch (error) {
                let errorMessage = error.message || '알 수 없는 오류가 발생했습니다.';

                // JSON 응답에서 상세 오류 정보 추출
                if (error.response) {
                    error.response.json().then(data => {
                        if (data.detail) {
                            if (typeof data.detail === 'string') {
                                errorMessage = data.detail;
                            } else if (data.detail.message) {
                                errorMessage = data.detail.message;
                            }
                        }
                        results.innerHTML = `<div class="alert alert-error">
                            <strong>오류 발생:</strong> ${errorMessage}
                            ${data.details ? `<br><small>상세: ${JSON.stringify(data.details)}</small>` : ''}
                        </div>`;
                    }).catch(() => {
                        results.innerHTML = `<div class="alert alert-error">
                            <strong>오류 발생:</strong> ${errorMessage}
                        </div>`;
                    });
                } else {
                    results.innerHTML = `<div class="alert alert-error">
                        <strong>오류 발생:</strong> ${errorMessage}
                    </div>`;
                }
            } finally {
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
