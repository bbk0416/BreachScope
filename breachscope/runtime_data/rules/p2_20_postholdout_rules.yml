- id: R-WINRS-REMOTE-TARGET
  name: WinRS Explicit Remote Target
  description: Sysmon process creation showing winrs with an explicit remote target
  field: command_line
  operator: regex
  pattern: '(?i)\bwinrs(?:\.exe)?\s+-r:\S+'
  severity: medium
  mitre_technique: T1021.006
  all_of:
    - field: event_id
      operator: equals
      pattern: "1"
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon

- id: R-DOMAIN-ACCOUNT-DISCOVERY-CMD
  name: Domain Account Discovery Command
  description: Sysmon process creation using common domain-account discovery commands
  field: command_line
  operator: regex
  pattern: '(?i)(?:\bnet(?:1)?(?:\.exe)?\s+users?\s+/domain\b|\bdsquery(?:\.exe)?\s+user\b|\bget-aduser\b|\bget-domainuser\b|\bwmic(?:\.exe)?\b.*?root\\directory\\ldap.*?\bds_user\b|\bget-wmiobject\b.*?\bds_user\b.*?root\\directory\\ldap)'
  severity: low
  mitre_technique: T1087.002
  all_of:
    - field: event_id
      operator: equals
      pattern: "1"
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
- id: R-NETWORK-CONFIG-NBTSTAT
  name: Network Configuration Discovery via NBTStat
  description: Sysmon process creation using nbtstat discovery switches to enumerate local or remote NetBIOS/network configuration
  field: command_line
  operator: regex
  pattern: '\bnbtstat(?:\.exe)?\s+[-/](?:n|c|s|a)\b'
  severity: low
  mitre_technique: T1016
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"

- id: R-PERMISSION-GROUPS-LOCAL-NET
  name: Local Permission Group Discovery via Net
  description: Sysmon process creation enumerating local groups with net/net1 localgroup while excluding group modification commands
  field: command_line
  operator: regex
  pattern: '(?i)\bnet1?(?:\.exe)?\s+localgroup\b(?!.*\s/(?:add|delete)\b)'
  severity: low
  mitre_technique: T1069.001
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"

- id: R-PERMISSION-GROUPS-DOMAIN-NET
  name: Domain Permission Group Discovery via Net
  description: Sysmon process creation enumerating domain groups with net/net1 group and /domain or /dom while excluding modifications
  field: command_line
  operator: regex
  pattern: '(?i)\bnet1?(?:\.exe)?\s+group\b(?=.*\s/(?:domain|dom)\b)(?!.*\s/(?:add|delete)\b)'
  severity: low
  mitre_technique: T1069.002
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"

- id: R-SMB-ADMIN-SHARE-NET-USE
  name: SMB Windows Admin Share Connection via Net Use
  description: Sysmon process creation using net/net1 use to connect to Windows administrative shares such as C$, ADMIN$, or IPC$
  field: command_line
  operator: regex
  pattern: '(?i)\bnet1?(?:\.exe)?\s+use\s+(?:[A-Za-z]:\s+)?\\\\[^\\\s]+\\(?:ADMIN\$|[A-Za-z]\$|IPC\$)(?=\s|$)'
  severity: medium
  mitre_technique: T1021.002
  all_of:
    - field: source
      operator: equals
      pattern: Microsoft-Windows-Sysmon
    - field: event_id
      operator: equals
      pattern: "1"
