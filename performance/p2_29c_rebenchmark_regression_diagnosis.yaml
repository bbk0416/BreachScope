findings:
  - id: F1
    statement: The P2-29B canonical result is a valid single paired observation and must remain sealed as observed.
    support: exact accounting matched, environment identity fields matched the sealed P2-28 baseline, and the first canonical after-run completed successfully.
  - id: F2
    statement: The post-hoc 2,000-record alternating probe does not reproduce a parser-level regression.
    support: the new parser average was 1.6102939500124194 seconds versus 1.8453615000180434 seconds for the old parser, with identical normalized output digests.
  - id: F3
    statement: EVTX record.xml generation dominates the short diagnostic path and varied materially even across adjacent runs.
    support: record.xml generation ranged from 15.411098700016737 to 25.03074519999791 seconds for the same 2,000 records, a 1.6242025106211748 max/min ratio.
  - id: F4
    statement: The available evidence does not establish that the single-parse refactor caused the P2-29B whole-run regression.
    support: the isolated parser did not reproduce the regression, while the much larger record.xml portion showed substantial short-run timing variation.

decision:
  rollback_single_parse_refactor: "NO"
  reason: correctness is preserved on current sealed detection evidence sources and the post-hoc parser probe does not show a parser-level slowdown
