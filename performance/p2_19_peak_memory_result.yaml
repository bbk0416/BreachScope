interpretation:
  scaling: >-
    The full synthetic pipeline completed at all preregistered scales, but observed
    peak working set increased from about 210 MiB at 10k events to about 1.69 GiB
    at 100k and about 10.43 GiB at one million events.
  one_million: >-
    The one-million-event run took 1911.779782 seconds, about 31 minutes 52 seconds,
    at 523.073 events per second and reached a 10,684.5 MiB peak working set.
  operational_conclusion: >-
    This result demonstrates that the current list-based full pipeline has a material
    large-input memory cost. It does not support an enterprise-scale or bounded-memory
    production claim.
