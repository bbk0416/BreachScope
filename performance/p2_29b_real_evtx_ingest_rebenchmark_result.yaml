interpretation:
  measured_result: On the exact pinned corpus and matching recorded machine environment, the single canonical P2-29B after-run completed in 10,727.157911 seconds at 71.466 events per second with a 4,773.25 MiB peak working set.
  paired_observation: Relative to the sealed P2-28 baseline, this single paired observation was 59.132403% longer in total ingest time, 37.158936% lower in throughput, and 16.456459% higher in peak working set.
  dominant_stage: EVTX-to-JSONL conversion was 9,334.587379 seconds in P2-29B versus 5,412.38946 seconds in P2-28, while collect-and-normalize was 1,380.083951 seconds versus 1,324.719248 seconds.
  causal_boundary: The benchmark protocol controls the recorded machine identity, Python version, corpus identity, and product commit, but it is one before observation and one after observation rather than a statistical benchmark. It does not establish that the single-parse code change caused the observed regression, and no general speedup or slowdown claim is made.
