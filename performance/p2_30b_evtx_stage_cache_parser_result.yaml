interpretation:
  parser_stage: The current single-parse parser had a 2.4767881999723613 second median versus 3.221731999947224 seconds for the old parser across five 5,000-record runs, a 23.12246332056998 percent lower median in this repeated stage-level observation.
  semantic_equivalence: All ten parser runs produced the same normalized output digest, so no output difference was observed on the pinned 5,000-record XML corpus.
  record_xml_variability: record.xml generation remained materially variable, with a 1.7813373864639979 max/min ratio for no-in-process-prewarm passes and 1.320029265955978 for immediate deliberate-warm second passes.
  p2_29b_relation: The repeated parser-stage observation does not reproduce a parser slowdown and therefore does not support attributing the P2-29B whole-run regression to the single-parse parser change alone.
  cache_boundary: The benchmark does not control or flush the OS page cache, so neither pass is evidence of true cold-cache performance.

